<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Service Tracker</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Barlow:wght@400;500;600&family=Barlow+Condensed:wght@600;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#F3F7FC;--panel:#FFFFFF;--ink:#1E2B3C;--mute:#5C6E85;--line:#DAE3EF;
  --side:#1E4478;--side-ink:#EAF1FB;--side-mute:#A9BDD8;
  --acc:#2F6FD0;--acc-ink:#FFFFFF;--acc-soft:#E4EEFC;
  --plate:#FFFFFF;--plate-ink:#1E4478;
  --ok:#23875F;--ok-soft:#DFF3E9;--warn:#4A5F7D;--warn-soft:#E8EEF6;--bad:#BC3541;--bad-soft:#FBE7E9;
  --bar-income:#C3D6F0;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --bg:#0F1A2B;--panel:#16243A;--ink:#E6EEF9;--mute:#9DB0C9;--line:#27395A;
    --side:#0B1423;--acc:#6AA5F5;--acc-ink:#0A1730;--acc-soft:#1B3358;
    --ok:#5FD3A0;--ok-soft:#133B2E;--warn:#A9BCD8;--warn-soft:#223552;--bad:#FF8E98;--bad-soft:#44202A;
    --bar-income:#2F4A73;
  }
}
:root[data-theme="dark"]{
  --bg:#0F1A2B;--panel:#16243A;--ink:#E6EEF9;--mute:#9DB0C9;--line:#27395A;
  --side:#0B1423;--acc:#6AA5F5;--acc-ink:#0A1730;--acc-soft:#1B3358;
  --ok:#5FD3A0;--ok-soft:#133B2E;--warn:#A9BCD8;--warn-soft:#223552;--bad:#FF8E98;--bad-soft:#44202A;
  --bar-income:#2F4A73;
}
*,*::before,*::after{box-sizing:inherit}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--ink);font:400 15px/1.5 Barlow,"Helvetica Neue",Arial,sans-serif}
h1,h2,h3{font-family:"Barlow Condensed","Arial Narrow",Arial,sans-serif;font-weight:700;margin:0;letter-spacing:.01em}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--acc);outline-offset:2px}
[hidden]{display:none!important}

.app{display:grid;grid-template-columns:244px minmax(0,1fr);min-height:100vh}
.side{background:var(--side);color:var(--side-ink)}
.sidein{position:sticky;top:env(safe-area-inset-top,0px);padding:18px 16px;display:flex;flex-direction:column;gap:14px;max-height:100vh;overflow-y:auto}
.brand h1{font-size:30px;line-height:1;color:#fff}
.brand p{margin:6px 0 0;color:var(--side-mute);font-size:13px}
.nav{display:flex;flex-direction:column;gap:2px}
.nav button,.sbtn{all:unset;cursor:pointer;display:flex;justify-content:space-between;align-items:center;gap:10px;padding:6px 12px;border-radius:6px;color:var(--side-ink);font-weight:500}
.nav button:hover,.sbtn:hover{background:rgba(255,255,255,.07)}
.nav button[aria-current="page"]{background:var(--plate);color:var(--plate-ink);font-weight:600}
.nav button:focus-visible,.sbtn:focus-visible,.ratebtn:focus-visible{outline:2px solid var(--plate);outline-offset:1px}
.nav .badge{font-size:12px;background:var(--bad);color:#fff;border-radius:10px;padding:0 7px;font-weight:600}
.nav button[aria-current="page"] .badge{background:var(--plate-ink);color:var(--plate)}
.ratebtn{all:unset;cursor:pointer;display:block;padding:8px 12px;border-radius:6px;background:rgba(255,255,255,.07);color:var(--side-ink);font-size:14px;line-height:1.3}
.ratebtn small{display:block;color:var(--side-mute);font-size:12px}
.ratebtn.stale{box-shadow:inset 0 0 0 1px var(--plate)}
.uchip{border-top:1px solid rgba(255,255,255,.12);padding-top:14px;display:flex;flex-direction:column;gap:2px}
.uchip b{display:block;font-weight:600}
.uchip small{color:var(--side-mute);margin-bottom:6px}
.sbtn{font-size:14px;color:var(--side-mute);padding:6px 12px}

main{padding:28px clamp(16px,3vw,40px) 60px;min-width:0}
.top{display:flex;justify-content:space-between;align-items:flex-end;gap:16px;flex-wrap:wrap;margin-bottom:22px}
.top h2{font-size:38px;line-height:1}
.top p{margin:4px 0 0;color:var(--mute)}
.btn{cursor:pointer;border:1px solid var(--line);background:var(--panel);padding:8px 14px;border-radius:6px;font-weight:600}
.btn:hover{border-color:var(--mute)}
.btn.primary{background:var(--acc);border-color:var(--acc);color:var(--acc-ink)}
.btn.primary:hover{filter:brightness(1.08)}
.btn.danger{color:var(--bad);border-color:transparent;background:transparent}
.btn.ghost{background:transparent}
.btn.sm{padding:4px 10px;font-size:13px}
.btn:disabled{opacity:.5;cursor:not-allowed}

.panel{background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:18px 20px;box-shadow:0 1px 2px rgba(30,68,120,.06)}
.panel h3{font-size:22px;margin-bottom:10px}
.sec{margin-bottom:16px}
.grid-hero{display:grid;grid-template-columns:minmax(0,1.6fr) minmax(0,1fr);gap:16px;margin-bottom:16px}
.grid-2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:16px;margin-bottom:16px}
.profit-big{font:700 64px/1 "Barlow Condensed","Arial Narrow",Arial,sans-serif;letter-spacing:.01em}
.profit-big .bs{font-size:18px;margin-top:4px}
.delta{font-weight:600;font-size:14px}
.delta.up{color:var(--ok)}.delta.down{color:var(--bad)}
.kv{display:flex;gap:26px;flex-wrap:wrap;margin:14px 0 6px;color:var(--mute);font-size:14px}
.kv b{display:block;color:var(--ink);font-size:20px;font-weight:600}
.bs{display:block;font-size:12px;color:var(--mute);font-weight:400;font-variant-numeric:tabular-nums}
.bsw{display:inline-block;vertical-align:top;text-align:inherit}
.sbar{height:6px;background:#e3e9f3;border-radius:4px;margin-top:5px;overflow:hidden;min-width:110px}.sbar i{display:block;height:100%;background:#2e8b57}.sbar.warn i{background:#d98a06}.sbar.bad i{background:#c0392b}
.pwwrap{position:relative;display:block}
.pwwrap input[type]{padding-right:46px}
.pweye{position:absolute;right:3px;top:50%;transform:translateY(-50%);width:38px;height:34px;display:flex;align-items:center;justify-content:center;background:transparent;border:0;border-radius:6px;color:var(--mute);cursor:pointer;padding:0}
.pweye:hover,.pweye:focus-visible{color:var(--ink);background:#e9eef7;outline:none}
.pweye[aria-pressed=true]{color:var(--brand,#2f6fd1)}
.authcard h3.sub{font-size:15px;margin:6px 0 -4px;color:var(--mute)}
.code{font-family:ui-monospace,Menlo,Consolas,monospace;font-weight:700;letter-spacing:.06em;background:var(--soft,#eef2f8);padding:2px 8px;border-radius:6px;white-space:nowrap}
.chart{width:100%;height:auto;display:block;margin-top:8px}
.legend{display:flex;gap:16px;font-size:13px;color:var(--mute)}
.legend i{display:inline-block;width:10px;height:10px;border-radius:2px;margin-right:6px}
.note{background:var(--acc-soft);color:var(--ink);border-radius:8px;padding:10px 14px;margin-bottom:16px;display:flex;gap:12px;align-items:center;flex-wrap:wrap;font-weight:500}
.note span{flex:1;min-width:200px}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:12px;margin-bottom:16px}
.kpi{background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:14px 16px}
.kpi>span{display:block;color:var(--mute);font-size:13px}
.kpi b{display:block;font:700 28px/1.15 "Barlow Condensed","Arial Narrow",Arial,sans-serif}
.kpi.net{border-color:var(--acc);border-width:2px}
.brow{display:grid;grid-template-columns:minmax(0,210px) 1fr auto;gap:12px;align-items:center;margin:8px 0;font-size:14px}
.brow i{display:block;height:10px;background:var(--acc);border-radius:2px;min-width:2px}
.stmt{width:100%;max-width:520px}
.stmt div{display:flex;justify-content:space-between;gap:20px;padding:5px 0;border-bottom:1px solid var(--line)}
.stmt .tot{border-bottom:2px solid var(--ink);font-weight:700}
.stmt .sub{padding-left:16px;color:var(--mute);font-size:14px}

.list{display:flex;flex-direction:column}
.row{display:flex;align-items:center;gap:12px;padding:10px 0;border-top:1px solid var(--line);flex-wrap:wrap}
.row:first-child{border-top:0}
.row .grow{flex:1;min-width:140px}
.row .t{font-weight:600}
.row .s,.hint{color:var(--mute);font-size:13px}
.time{font:700 22px/1 "Barlow Condensed","Arial Narrow",Arial,sans-serif;min-width:54px}
.empty{color:var(--mute);padding:14px 0}
.click{cursor:pointer}

.plate{display:inline-block;background:#fff;color:#1E4478;border:2px solid #1E4478;border-left-width:9px;border-radius:5px;padding:1px 9px;font:700 17px/1.25 "Barlow Condensed","Arial Narrow",Arial,sans-serif;letter-spacing:.09em;white-space:nowrap}
.tag{display:inline-block;font-size:12px;font-weight:600;padding:1px 8px;border-radius:10px;white-space:nowrap}
.tag.pendiente,.tag.programada,.tag.pronto{background:var(--warn-soft);color:var(--warn)}
.tag.proceso,.tag.custom,.tag.parcial{background:var(--acc-soft);color:var(--acc)}
.tag.terminado,.tag.completada,.tag.hecho,.tag.activo,.tag.pagada,.tag.pagado{background:var(--ok-soft);color:var(--ok)}
.tag.cancelada,.tag.luego,.tag.inactivo,.tag.anulada,.tag.rechazado{background:var(--line);color:var(--mute)}
.tag.vencido,.tag.porpagar{background:var(--bad-soft);color:var(--bad)}
.tag.presupuesto{background:transparent;color:var(--mute);border:1px dashed var(--mute)}
.tag.admin{background:var(--acc);color:var(--acc-ink)}

.tablewrap{overflow-x:auto}
table{width:100%;border-collapse:collapse;min-width:680px}
th{font-weight:600;color:var(--mute);font-size:13px;text-align:left;padding:8px 10px;border-bottom:2px solid var(--line)}
td{padding:10px;border-bottom:1px solid var(--line);vertical-align:middle}
tbody tr.click:hover{background:var(--bg)}
td.num,th.num{text-align:right;font-variant-numeric:tabular-nums;white-space:nowrap}
tfoot td{font-weight:700;border-top:2px solid var(--ink)}
.neg{color:var(--bad)}
.toolbar{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:14px;align-items:center}
.chips{display:flex;gap:6px;flex-wrap:wrap}
.chip{cursor:pointer;border:1px solid var(--line);background:var(--panel);border-radius:16px;padding:3px 12px;font-size:14px}
.chip[aria-pressed="true"]{background:var(--acc);color:var(--acc-ink);border-color:var(--acc)}
input[type=search],input[type=text],input[type=email],input[type=tel],input[type=password],input[type=number],input[type=date],input[type=time],select,textarea{width:100%;background:var(--panel);border:1px solid var(--line);border-radius:6px;padding:8px 10px}
.toolbar input[type=search]{width:300px;max-width:100%}
textarea{resize:vertical;min-height:80px}
input[readonly]{background:var(--bg);color:var(--mute)}

.f{display:block}
.f>span{display:block;font-size:13px;font-weight:600;color:var(--mute);margin-bottom:3px}
.fgrid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
.fgrid .full,.mb .full{grid-column:1/-1}
.chk{display:flex;gap:8px;align-items:flex-start;font-size:14px;cursor:pointer}
.chk input{margin-top:4px}
.actions{display:flex;gap:10px;flex-wrap:wrap;align-items:center;margin-top:6px}

.vb{border:1px solid var(--line);border-radius:8px;padding:14px;margin-bottom:12px;background:var(--bg)}
.vbh{display:flex;justify-content:space-between;align-items:center;margin-bottom:8px}
.phr{display:flex;gap:8px;margin-bottom:8px}
.picked{display:flex;align-items:center;gap:12px;flex-wrap:wrap;background:var(--acc-soft);border-radius:8px;padding:12px 14px;margin-bottom:12px}
.picked .grow{flex:1;min-width:180px}
.res{display:flex;flex-direction:column;border:1px solid var(--line);border-radius:8px;margin-top:8px;overflow:hidden}
.res button{all:unset;cursor:pointer;padding:9px 12px;border-top:1px solid var(--line);display:block}
.res button:first-child{border-top:0}
.res button:hover,.res button:focus-visible{background:var(--acc-soft)}
.res .nores{padding:12px;color:var(--mute)}

.lh,.line{display:grid;grid-template-columns:minmax(0,1fr) 150px 84px;gap:8px;align-items:center}
.lh{font-size:12px;font-weight:600;color:var(--mute);margin-bottom:4px}
.line{margin-bottom:8px}
.lh.prt,.line.prt{grid-template-columns:minmax(0,1fr) 72px 120px 130px 84px}
.pc{min-width:0}
.stq{width:auto;padding:2px 8px;font-size:13px;font-weight:600;border:0;border-radius:12px;cursor:pointer}
.stq.st-pendiente{background:var(--warn-soft);color:var(--warn)}
.stq.st-proceso{background:var(--acc-soft);color:var(--acc)}
.stq.st-terminado{background:var(--ok-soft);color:var(--ok)}
a.btn{text-decoration:none;display:inline-block;color:inherit}

.pkr{display:grid;grid-template-columns:minmax(0,1fr) 84px 130px 72px;gap:8px;align-items:start;margin-bottom:8px}
.pkr.pkhd{align-items:end;font-size:12px;font-weight:600;color:var(--mute);margin-bottom:4px}
.pc .bs{text-align:right;margin-top:2px;min-height:15px}
.subt .bs{text-align:right}
.lh.tot,.line.tot{grid-template-columns:minmax(0,1fr) 170px 96px 96px 84px 84px}
.lh.lab,.line.lab{grid-template-columns:minmax(0,1fr) 170px 80px 110px 84px}
.fgrid.auto{grid-template-columns:repeat(auto-fill,minmax(190px,1fr))}
.insp>summary,.isys>summary{cursor:pointer;list-style:none;display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.insp>summary::-webkit-details-marker,.isys>summary::-webkit-details-marker{display:none}
.insp>summary::before,.isys>summary::before{content:"▸";color:var(--mute);transition:transform .15s}
.insp[open]>summary::before,.isys[open]>summary::before{transform:rotate(90deg)}
.insp>summary:focus-visible,.isys>summary:focus-visible{outline:2px solid var(--acc);outline-offset:2px;border-radius:6px}
.insp-body{margin-top:12px}
.isys{border:1px solid var(--line);border-radius:8px;margin-bottom:8px;background:var(--panel)}
.isys>summary{padding:10px 14px;font-weight:600}
.isys>summary .cnt{margin-left:auto;display:flex;gap:6px;flex-wrap:wrap}
.isys-b{padding:0 14px 10px}
.igrp,.ip-row{display:grid;grid-template-columns:minmax(0,1fr) 64px 64px;gap:8px;align-items:center}
.igrp{font-size:12px;font-weight:600;color:var(--mute);text-transform:uppercase;letter-spacing:.04em;margin-top:10px;padding-bottom:4px;border-bottom:2px solid var(--line)}
.igrp span:nth-child(n+2){text-align:center}
.ip-row{padding:3px 6px;border-bottom:1px solid var(--line)}
.ip-row.on{background:var(--acc-soft)}
.ipc{display:flex;justify-content:center;cursor:pointer;padding:5px}
.ipc input{width:18px;height:18px;cursor:pointer;margin:0}
.subt{text-align:right;font-variant-numeric:tabular-nums;font-weight:600}
.totals{display:flex;flex-direction:column;gap:6px;max-width:380px;margin-left:auto}
.totals>div{display:flex;justify-content:space-between;gap:20px;align-items:flex-start}
.totals>div>b,.totals>div>span:last-child{text-align:right}
.totals .big{font:700 34px/1.1 "Barlow Condensed","Arial Narrow",Arial,sans-serif;border-top:2px solid var(--ink);padding-top:8px;margin-top:4px}
.det{width:100%;min-width:0}
.det td,.det th{padding:6px 8px}

.permgrid{display:grid;grid-template-columns:1fr 1fr;gap:6px 18px}
.permgrid h4{grid-column:1/-1;margin:10px 0 0;font-size:13px;color:var(--mute)}
fieldset{border:0;padding:0;margin:0;min-width:0}
fieldset:disabled{opacity:.5}
.presets{display:flex;gap:6px;flex-wrap:wrap}

dialog{border:1px solid var(--line);border-radius:10px;padding:0;background:var(--panel);color:var(--ink);width:min(620px,calc(100% - 24px));max-height:calc(100% - 24px)}
dialog.wide{width:min(880px,calc(100% - 24px))}
dialog::backdrop{background:rgba(10,15,18,.55)}
dialog form{display:flex;flex-direction:column;max-height:calc(100vh - 40px)}
dialog header{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:16px 20px 8px}
dialog header h2{font-size:28px;display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.x{all:unset;cursor:pointer;font-size:26px;line-height:1;padding:4px 10px;color:var(--mute)}
.x:focus-visible{outline:2px solid var(--acc)}
.mb{padding:8px 20px 16px;overflow-y:auto;display:grid;grid-template-columns:1fr 1fr;gap:12px}
dialog footer{display:flex;gap:8px;padding:12px 20px;border-top:1px solid var(--line);align-items:center;flex-wrap:wrap}
.sp{flex:1}
.toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--panel);padding:9px 18px;border-radius:8px;font-weight:500;z-index:1000;box-shadow:0 4px 18px rgba(0,0,0,.25);max-width:calc(100% - 24px)}
.set{display:grid;gap:16px;max-width:860px}
.set .panel p{margin:0 0 10px;color:var(--mute);font-size:14px}
.inl{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px}
.logoprev{display:flex;align-items:center;gap:12px;flex-wrap:wrap}
.logoprev img{max-height:64px;max-width:200px;border:1px solid var(--line);border-radius:6px;padding:4px;background:#fff}

.auth{min-height:100vh;display:grid;place-items:center;padding:20px;background:var(--side)}
.authcard{width:min(440px,100%);background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:28px;display:grid;gap:14px}
.authcard h1{font-size:44px;line-height:1}
.authcard p{margin:0;color:var(--mute)}

/* Factura: siempre en colores claros, también al imprimir */
.inv{background:#fff;color:#111;border:1px solid #bbb;padding:22px;font:13px/1.4 Arial,Helvetica,sans-serif;position:relative;text-align:left}
.inv *{color:inherit}
.inv-h{display:flex;justify-content:space-between;gap:18px;border-bottom:2px solid #111;padding-bottom:12px;margin-bottom:12px;flex-wrap:wrap}
.inv-who{display:flex;gap:12px;align-items:flex-start;min-width:240px;flex:1}
.inv-who img{max-height:62px;max-width:130px;object-fit:contain}
.inv-who b{font-size:16px}
.inv-no{text-align:right;min-width:190px}
.inv-title{font:700 26px/1 "Barlow Condensed","Arial Narrow",Arial,sans-serif;letter-spacing:.04em;margin-bottom:4px}
.inv-box{border:1px solid #888;padding:8px 10px;margin-bottom:12px;display:grid;grid-template-columns:1fr 1fr;gap:4px 18px}
.inv-box .w{grid-column:1/-1}
.inv table{min-width:0;margin-bottom:10px}
.inv th{background:#eee;color:#111;border:1px solid #888;padding:5px 7px;font-size:12px}
.inv td{border:1px solid #bbb;padding:5px 7px}
.inv .kind td{background:#f5f5f5;font-weight:700;font-size:12px}
.inv-tot{margin-left:auto;width:min(360px,100%);margin-bottom:10px}
.inv-tot div{display:flex;justify-content:space-between;gap:12px;padding:3px 0;border-bottom:1px solid #ccc}
.inv-tot .g{font-weight:700;font-size:15px;border-bottom:2px solid #111}
.inv-note{font-size:12px;margin:4px 0}
.inv-foot{border-top:1px solid #888;margin-top:12px;padding-top:8px;font-size:11px;color:#333}
.inv-void{position:absolute;inset:0;display:grid;place-items:center;pointer-events:none;font:700 90px/1 Arial,sans-serif;color:rgba(190,30,30,.25);transform:rotate(-18deg)}
#printArea{display:none}
@media print{
  .app,.auth,dialog,.toast{display:none!important}
  #printArea{display:block!important}
  body{background:#fff}
  .inv{border:0;padding:0}
}

@media (max-width:900px){.grid-hero,.grid-2{grid-template-columns:1fr}}
@media (max-width:820px){
  .app{grid-template-columns:1fr}
  .sidein{position:static;max-height:none;flex-direction:row;align-items:center;gap:14px;padding:12px;overflow-x:auto}
  .brand p,.uchip small{display:none}
  .brand h1{font-size:24px;white-space:nowrap}
  .nav{flex-direction:row}
  .nav button,.ratebtn{white-space:nowrap}
  .uchip{border:0;padding:0;flex-direction:row;align-items:center;gap:8px;white-space:nowrap}
  .profit-big{font-size:52px}
  .mb,.fgrid,.permgrid,.inv-box{grid-template-columns:1fr}
  .lh{display:none}
  .line,.line.prt,.line.tot,.line.lab{grid-template-columns:1fr 1fr}
  .line>:first-child{grid-column:1/-1}
  .totals{max-width:none}
  .brow{grid-template-columns:1fr auto}
  .brow i{grid-column:1/-1}
}
@media (prefers-reduced-motion:no-preference){
  .toast{animation:pop .2s ease-out}

function genShopCode(){

const RATE_URL_DEFAULT='https://ve.dolarapi.com/v1/dolares/oficial';
let rateStatus={state:'idle',msg:''},rateTried=false;
function pickRate(data,path){
  const dig=(o,p)=>p.split('.').reduce((a,k)=>a==null?a:a[k],o);
  if(path){const v=num(dig(data,path));return v>0?{rate:v}:null}
  let o=data;
  if(Array.isArray(o))o=o.find(x=>x&&/oficial|bcv/i.test(String(x.fuente||x.source||x.nombre||'')))||o[0];
  if(!o||typeof o!=='object')return null;
  for(const k of ['promedio','tasa','rate','price','usd','venta','compra']){
    const v=o[k];
    if(num(v)>0)return {rate:num(v)};
    if(v&&typeof v==='object'){const w=num(v.promedio||v.tasa||v.rate||v.price);if(w>0)return {rate:w}}
  }
  if(o.data)return pickRate(o.data,'');
  return null;
}
async function fetchRate(manual){
  const ue=$('#rateUrl'),pe=$('#ratePath');
  const url=((ue?ue.value:S.shop.rateUrl)||RATE_URL_DEFAULT).trim();
  const path=((pe?pe.value:S.shop.ratePath)||'').trim();
  const say=m=>{const b=$('#rateNet');if(b)b.textContent=m};
  if(!/^https:\/\//i.test(url)){rateStatus={state:'err',msg:'La dirección debe empezar por https://'};say(rateStatus.msg);if(manual)toast(rateStatus.msg);return false}
  rateStatus={state:'loading',msg:'Consultando…'};say(rateStatus.msg);
  try{
    const ctl=new AbortController();const to=setTimeout(()=>ctl.abort(),8000);
    const r=await fetch(url,{signal:ctl.signal,cache:'no-store'});clearTimeout(to);
    if(!r.ok)throw new Error('HTTP '+r.status);
    const got=pickRate(await r.json(),path);
    if(!got)throw new Error('no se encontró la tasa en la respuesta');
    const date=today();
    S.rates=S.rates.filter(x=>x.date!==date);S.rates.push({date,rate:got.rate,src:'internet'});
    save();
    rateStatus={state:'ok',msg:'Tasa actualizada: Bs. '+fmtRate(got.rate)+' por US$ 1'};
    if(manual)closeDlg();
    render();if(manual)toast(rateStatus.msg);
    return true;
  }catch(e){
    const why=e&&e.name==='AbortError'?'tiempo de espera agotado':(e&&e.message)||'sin conexión';
    rateStatus={state:'err',msg:'No se pudo consultar internet ('+why+'). Si abriste la app desde el enlace de Claude, el navegador bloquea las consultas externas: abre el archivo descargado en tu equipo o ingresa la tasa manualmente.'};
    say(rateStatus.msg);
    if(manual)toast('No se pudo obtener la tasa desde internet');
    return false;
  }
}
function maybeAutoRate(){
  if(rateTried||S.shop.rateAuto===false||!can('rate.edit'))return;
  const re=rateEntry();if(re&&re.date===today())return;
  rateTried=true;fetchRate(false);
}

function cfKind(ch){
  const f=$('#cf');if(!f)return;

function readVeh(b){return {id:b.dataset.vid||'',make:rd(b,'make'),model:rd(b,'model'),year:num(rd(b,'year'))||'',plate:rd(b,'plate').toUpperCase(),vin:rd(b,'vin').toUpperCase(),km:num(rd(b,'km'))}}
function applyVeh(o,v){
  const oldKm=lastKm(o).km;
  Object.assign(o,{make:v.make,model:v.model,year:v.year,plate:v.plate,vin:v.vin});
  if(!o.kmDate||v.km!==oldKm){o.km=v.km;o.kmDate=v.km?today():(o.kmDate||'')}
}
function plateConflict(v,list){
  const p=normPlate(v.plate);
  if(list&&list.filter(x=>normPlate(x.plate)===p).length>1)return 'La placa '+v.plate+' está repetida';
  const d=S.vehicles.find(x=>x.id!==v.id&&normPlate(x.plate)===p);
  return d?'La placa '+v.plate+' ya está registrada a nombre de '+cName(vOwner(d)):'';
}
function saveClient(){
  const form=$('#cf');
  const first=rd(form,'first'),last=rd(form,'last'),idType=rd(form,'idType'),idNum=rd(form,'idNum'),address=rd(form,'address'),kind=rd(form,'kind')==='empresa'?'empresa':'natural',email=rd(form,'email').toLowerCase(),contact=rd(form,'contact');
  const retIva=kind==='empresa'&&!!form.elements.retIva&&form.elements.retIva.checked,retPct=num(rd(form,'retPct'))||75;
  const phones=$$('.ph',form).map(i=>i.value.trim()).filter(Boolean);
  if(!first)return toast(kind==='empresa'?'Escribe la razón social de la empresa':'Escribe los nombres del cliente');
  if(kind==='natural'&&!last)return toast('Escribe los apellidos del cliente');
  if(email&&!isEmail(email))return toast('El correo electrónico no es válido');
  if(!idNum)return toast('Escribe el número de identificación');
  if(!phones.length)return toast('Agrega al menos un número de contacto');
  const dupId=S.clients.find(c=>c.id!==editClientId&&c.idType===idType&&c.idNum.toLowerCase()===idNum.toLowerCase());
  if(dupId)return toast('Ya existe un cliente con esa identificación: '+cName(dupId));
  const vbs=[];
  for(const b of $$('.vb',form)){
    const v=readVeh(b);
    if(!v.id&&!v.make&&!v.model&&!v.plate&&!v.vin&&!v.year&&!v.km)continue;
    if(!v.model||!v.plate)return toast('Cada vehículo necesita modelo y placa');
    vbs.push(v);
  }
  for(const v of vbs){const e=plateConflict(v,vbs);if(e)return toast(e)}
  let c=editClientId?client(editClientId):null;
  if(!c){c={id:uid()};S.clients.push(c)}
  Object.assign(c,{kind,first,last:kind==='empresa'?'':last,idType,idNum,phones,address,email,contact:kind==='empresa'?contact:'',retIva,retPct:retIva?retPct:0});
  const keep=new Set();
  vbs.forEach(v=>{
    let o=v.id?veh(v.id):null;
    if(!o){o={id:uid(),clientId:c.id,km:0,kmDate:''};S.vehicles.push(o)}
    applyVeh(o,v);keep.add(o.id);
  });
  S.vehicles=S.vehicles.filter(v=>v.clientId!==c.id||keep.has(v.id)||S.services.some(s=>s.vehicleId===v.id));
  save();toast(editClientId?'Cliente actualizado':'Cliente registrado');
  const after=afterClient;afterClient=null;editClientId=null;
  if(after==='service'&&can('services.create'))go('servicioForm',{clientId:c.id});else go('clientes');
}

const INSP=INSP_RAW.map(s=>({id:s[0],name:s[1],groups:s[2].map(g=>({n:g[0],items:g[1]}))}));
const INSP_IDX=(()=>{const m={};INSP.forEach(s=>s.groups.forEach(g=>g.items.forEach(it=>{m[s.id+'.'+slug(it)]={sys:s.name,grp:g.n,name:it}})));return m})();

const cntTags=c=>(c.r?`<span class="tag proceso">${c.r} a revisar</span>`:'')+(c.c?`<span class="tag vencido">${c.c} a cambiar</span>`:'');
function sysCounts(sid){const c={r:0,c:0};Object.keys((sd&&sd.insp)||{}).forEach(k=>{if(k.indexOf(sid+'.')===0){const e=sd.insp[k];if(e.r)c.r++;if(e.c)c.c++}});return c}
function allCounts(){const c={r:0,c:0};Object.values((sd&&sd.insp)||{}).forEach(e=>{if(e.r)c.r++;if(e.c)c.c++});return c}
function inspSet(key,f,val){
  const ref=INSP_IDX[key];
  const e=sd.insp[key]||(sd.insp[key]={r:false,c:false,note:'',sys:ref?ref.sys:'',grp:ref?ref.grp:'',name:ref?ref.name:key});
  e[f]=!!val;
  if(!e.r&&!e.c)delete sd.insp[key];
}
function inspSummary(){
  const keys=Object.keys(sd.insp||{});
  if(!keys.length)return '<div class="hint" style="margin-top:12px">Aún no hay partes marcadas. Abre un sistema y marca “Revisar” o “Cambiar”.</div>';
  const so=k=>{const i=INSP.findIndex(s=>k.indexOf(s.id+'.')===0);return i<0?99:i};
  keys.sort((a,b)=>so(a)-so(b)||sd.insp[a].name.localeCompare(sd.insp[b].name,'es'));
  return `<h3 style="font-size:18px;margin:16px 0 6px">Partes marcadas (${keys.length})</h3><div class="list">${keys.map(k=>{const e=sd.insp[k];return `<div class="row"><div class="grow"><div class="t">${esc(e.name)}</div><div class="s">${esc(e.sys)}${e.grp?' · '+esc(e.grp):''}</div></div>${e.r?'<span class="tag proceso">Revisar</span>':''}${e.c?'<span class="tag vencido">Cambiar</span>':''}<input class="ip-note" data-key="${esc(k)}" type="text" placeholder="Observación (opcional)" value="${esc(e.note||'')}" style="flex:1 1 200px;max-width:340px" aria-label="Observación de ${esc(e.name)}">${e.c?`<button type="button" class="btn sm" data-act="ipToPart" data-key="${esc(k)}">+ Repuesto</button>`:''}<button type="button" class="btn sm" data-act="ipToLabor" data-key="${esc(k)}">+ Mano de obra</button><button type="button" class="btn sm danger" data-act="ipRemove" data-key="${esc(k)}">Quitar</button></div>`}).join('')}</div>`;
}
function inspHTML(){
  const m=sd.insp||{};
  const systems=INSP.map(s=>{
    const c=sysCounts(s.id),open=inspUI.sys[s.id]!==undefined?inspUI.sys[s.id]:(c.r+c.c>0);
    const n=s.groups.reduce((t,g)=>t+g.items.length,0);
    return `<details class="isys" data-sys="${s.id}"${open?' open':''}><summary><span>${esc(s.name)} <span class="hint">(${n} partes)</span></span><span class="cnt" data-cnt="${s.id}">${cntTags(c)}</span></summary><div class="isys-b">${s.groups.map(g=>`<div class="igroup"><div class="igrp"><span>${esc(g.n)}</span><span>Revisar</span><span>Cambiar</span></div>${g.items.map(it=>{
      const key=s.id+'.'+slug(it),e=m[key]||{};
      return `<div class="ip-row${e.r||e.c?' on':''}" data-key="${key}" data-s="${esc(norm(it+' '+g.n+' '+s.name))}"><span>${esc(it)}</span><label class="ipc"><input type="checkbox" data-ip="r" data-key="${key}"${e.r?' checked':''} aria-label="Revisar: ${esc(it)}"></label><label class="ipc"><input type="checkbox" data-ip="c" data-key="${key}"${e.c?' checked':''} aria-label="Cambiar: ${esc(it)}"></label></div>`}).join('')}</div>`).join('')}</div></details>`;
  }).join('');
  return `<details class="panel sec insp" id="inspMain"${inspUI.open?' open':''}><summary><h3 style="margin:0">Inspección del vehículo: partes a revisar o cambiar</h3><span id="inspCnt" class="cnt" style="display:flex;gap:6px;flex-wrap:wrap">${cntTags(allCounts())}</span></summary>
   <div class="insp-body"><p class="hint" style="margin:0 0 10px">Despliega un sistema y marca cada parte que hay que <b>revisar</b>, <b>cambiar</b> o ambas. Las partes marcadas quedan guardadas en el servicio.</p>
   <div class="toolbar"><input type="search" id="inspQ" placeholder="Buscar una parte (ej. rótula, bujía, caucho, clutch…)" value="${esc(inspUI.q||'')}" aria-label="Buscar parte del vehículo"><button type="button" class="btn sm" data-act="inspExpand">Expandir todo</button><button type="button" class="btn sm" data-act="inspCollapse">Contraer todo</button><label class="chk"><input type="checkbox" id="inspOnly"${inspUI.only?' checked':''}><span>Solo marcadas</span></label><button type="button" class="btn sm danger" data-act="inspClear">Limpiar marcas</button></div>
   ${systems}<div id="inspNoRes" class="empty" hidden>Ninguna parte coincide con la búsqueda.</div><div id="inspSum">${inspSummary()}</div></div></details>`;
}
function inspFilter(){
  const q=norm(inspUI.q||''),only=!!inspUI.only,active=!!q||only;
  const sys=$$('.isys');
  sys.forEach(sy=>{
    let n=0;
    $$('.igroup',sy).forEach(gr=>{
      let c=0;
      $$('.ip-row',gr).forEach(r=>{const vis=(!q||r.dataset.s.includes(q))&&(!only||r.classList.contains('on'));r.hidden=!vis;if(vis)c++});
      gr.hidden=c===0;n+=c;
    });
    sy.hidden=active&&n===0;
    if(q&&n>0&&!sy.open)sy.open=true;
  });
  const nr=$('#inspNoRes');if(nr)nr.hidden=!(active&&sys.length>0&&sys.every(x=>x.hidden));
}
function inspRefresh(){
  const m=sd.insp||{};
  $$('.ip-row').forEach(r=>{const e=m[r.dataset.key];r.classList.toggle('on',!!(e&&(e.r||e.c)))});
  INSP.forEach(s=>{const c=$('[data-cnt="'+s.id+'"]');if(c)c.innerHTML=cntTags(sysCounts(s.id))});
  const t=$('#inspCnt');if(t)t.innerHTML=cntTags(allCounts());
  const sm=$('#inspSum');if(sm)sm.innerHTML=inspSummary();
  if(inspUI.only)inspFilter();
}
function ipAdd(kind,key){
  const e=sd.insp[key];if(!e)return;
  const lst=$(kind==='part'?'#partList':'#labList'),sel=kind==='part'?'.line.prt':'.line.lab';
  let row=$$(sel,lst).find(r=>!$('.ld',r).value.trim()&&!$('.lp',r).value);
  if(!row){lst.insertAdjacentHTML('beforeend',kind==='part'?partRow({qty:1}):laborRow({}));row=$$(sel,lst).pop()}
  let nm=e.name;
  if(kind==='labor'){const lc=/^[A-ZÁÉÍÓÚÑ]{2}/.test(nm)?nm:nm.charAt(0).toLowerCase()+nm.slice(1);nm=(e.c?'Cambio de ':'Revisión de ')+lc}
  $('.ld',row).value=nm;
  if(kind==='part'){const p=S.catalog.parts[nm];if(p){$('.lp',row).value=p.price;const c=$('.lc',row);if(c)c.value=p.cost}}
  else if(labExists(nm)){const i=labInfo(nm);$('.lp',row).value=i.price;if(i.hours)$('.lhrs',row).value=i.hours}
  updTotals();row.scrollIntoView({block:'center',behavior:'smooth'});
  toast((kind==='part'?'Agregado a repuestos: ':'Agregado a mano de obra: ')+nm);
}

function autoPrice(row){
  const pr=$('.lp',row),h=num($('.lhrs',row).value);
  const sv=$('#sf [name="mechanicId"]');
  const mid=$('.lm',row).value||(sv?sv.value:'');
  const m=S.mechanics.find(x=>x.id===mid);
  if(!m||!num(m.rate)||!h)return;
  if(!pr.value||row.dataset.auto==='1'){pr.value=r2(h*num(m.rate));row.dataset.auto='1';updTotals()}
}
function mechStats(mid,range){
  const [a,b]=range;let hours=0,labor=0;const set=new Set();
  S.services.forEach(s=>{
    if(s.status!=='terminado'||s.date<a||s.date>b)return;
    const lines=s.labor||[];
    lines.forEach(l=>{if((l.mechanicId||s.mechanicId)===mid){hours+=num(l.hours);labor+=num(l.price);set.add(s.id)}});
    if(!lines.length&&s.mechanicId===mid)set.add(s.id);
  });
  const m=S.mechanics.find(x=>x.id===mid);
  const open=S.services.filter(s=>isOpen(s)&&(s.mechanicId===mid||(s.labor||[]).some(l=>l.mechanicId===mid))).length;
  return {hours,labor,n:set.size,open,comm:labor*num(m&&m.commission)/100};
}

/* ---------- Reportes ---------- */
const GROUPS=[['ninguno','Sin agrupar'],['mes','Mes'],['tipo','Tipo de servicio'],['mecanico','Mecánico'],['anio','Año del vehículo'],['marca','Marca'],['cliente','Cliente'],['estado','Estado']];
const REP_PRESETS=[['mes','Este mes'],['mesant','Mes anterior'],['3m','Últimos 3 meses'],['6m','Últimos 6 meses'],['anio','Este año'],['anioant','Año anterior'],['todo','Todo el historial'],['custom','Personalizado']];
const repDefault=()=>({preset:'mes',from:'',to:'',status:'todos',type:'',mech:'',make:'',yFrom:'',yTo:'',client:'',inv:'todos',prov:'',text:'',min:'',group:'ninguno',sort:'fecha_desc'});
let rf=repDefault();
function repRange(){
  const p=rf.preset;
  if(p==='custom')return [rf.from||'0000-01-01',rf.to||'9999-12-31'];
  const n=new Date(),y=n.getFullYear(),m=n.getMonth(),f=d=>ymd(d);
  if(p==='6m')return [f(new Date(y,m-5,1)),f(new Date(y,m+1,0))];
  if(p==='anioant')return [(y-1)+'-01-01',(y-1)+'-12-31'];
  return periodRange(p);
}
function repRows(){
  const [a,b]=repRange(),q=rf.client.trim().toLowerCase(),tx=rf.text.trim().toLowerCase(),min=num(rf.min),rows=[];
  S.services.forEach(s=>{
    if(s.date<a||s.date>b)return;
    if(rf.status!=='todos'&&s.status!==rf.status)return;
    if(rf.status==='todos'&&s.status==='presupuesto')return;
    if(rf.type==='__none'){if(s.type)return}else if(rf.type&&s.type!==rf.type)return;
    const v=veh(s.vehicleId)||{},c=vOwner(v)||null,t=totals(s),inv=invoiceOf(s.id);
    const lines=s.labor||[];
    let mids=lines.map(l=>l.mechanicId||s.mechanicId||'');
    if(!lines.length)mids=[s.mechanicId||''];
    mids=[...new Set(mids)];
    if(rf.mech){const ok=rf.mech==='__none'?mids.includes(''):mids.includes(rf.mech);if(!ok)return}
    if(rf.make&&v.make!==rf.make)return;
    if(rf.yFrom&&num(v.year)<num(rf.yFrom))return;
    if(rf.yTo&&num(v.year)>num(rf.yTo))return;
    if(q&&![cName(c),c&&c.idNum,v.plate,v.vin,v.model].join(' ').toLowerCase().includes(q))return;
    if(rf.inv==='si'&&!inv)return;
    if(rf.inv==='no'&&inv)return;
    if(rf.prov&&!(s.tot||[]).some(x=>x.providerId===rf.prov))return;
    if(tx&&![s.desc,lines.map(l=>l.desc).join(' '),(s.parts||[]).map(p=>p.desc).join(' '),(s.tot||[]).map(x=>x.desc).join(' '),(s.inspection||[]).map(x=>x.name).join(' ')].join(' ').toLowerCase().includes(tx))return;
    if(min&&t.total<min)return;
    rows.push({s,v,c,t,inv,mids,hours:sum(lines,l=>num(l.hours))});
  });
  const so=rf.sort,fin=can('finance.view');
  rows.sort((x,y)=>so==='fecha_asc'?(x.s.date<y.s.date?-1:1):so==='total_desc'?y.t.total-x.t.total:(so==='ganancia_desc'&&fin)?y.t.profit-x.t.profit:so==='horas_desc'?y.hours-x.hours:(x.s.date<y.s.date?1:-1));
  return rows;
}
function repKpis(rows){
  const k={n:rows.length,total:0,labor:0,parts:0,tot:0,cost:0,profit:0,hours:0};
  rows.forEach(r=>{k.total+=r.t.total;k.labor+=r.t.labor;k.parts+=r.t.parts;k.tot+=r.t.tot;k.cost+=r.t.cost;k.profit+=r.t.profit;k.hours+=r.hours});
  k.avg=k.n?k.total/k.n:0;return k;
}
function repFilterTexts(){
  const [a,b]=repRange(),t=[];
  t.push('Periodo: '+(rf.preset==='todo'?'todo el historial':(a==='0000-01-01'?'inicio':fmtFull(a))+' al '+(b==='9999-12-31'?'hoy':fmtFull(b))));
  if(rf.status!=='todos')t.push('Estado: '+sLabel[rf.status]);

function repGroups(rows){
  if(rf.group==='ninguno')return null;
  const fin=can('finance.view'),m=new Map();
  const get=(label,sk)=>{if(!m.has(label))m.set(label,{label,sk,n:0,hours:0,labor:0,parts:0,tot:0,total:0,profit:0,comm:0});return m.get(label)};
  if(rf.group==='mecanico'){
    rows.forEach(r=>{
      const seen=new Set(),lines=r.s.labor||[];
      const hd=(mid,h,p)=>{const mm=S.mechanics.find(x=>x.id===mid);const g=get(mm?mName(mm):'Sin asignar',mm?mName(mm):'~');g.hours+=h;g.labor+=p;if(mm)g.comm+=p*num(mm.commission)/100;if(!seen.has(g.label)){seen.add(g.label);g.n++}};
      if(lines.length)lines.forEach(l=>hd(l.mechanicId||r.s.mechanicId||'',num(l.hours),num(l.price)));else hd(r.s.mechanicId||'',0,0);
    });
    const arr=[...m.values()].sort((a,b)=>b.hours-a.hours);
    return {head:['Mecánico','Servicios','Horas','Mano de obra'].concat(fin?['Comisión']:[]),types:['t','i','h','m'].concat(fin?['m']:[]),
      body:arr.map(g=>[g.label,g.n,g.hours,g.labor].concat(fin?[g.comm]:[])),
      foot:['Total','',sum(arr,g=>g.hours),sum(arr,g=>g.labor)].concat(fin?[sum(arr,g=>g.comm)]:[])};
  }
  const keyOf=r=>{
    switch(rf.group){
      case 'mes':return [parse(monthKey(r.s.date)+'-01').toLocaleDateString('es',{month:'long',year:'numeric'}),monthKey(r.s.date)];
      case 'tipo':return [r.s.type||'Sin clasificar',r.s.type||'~'];
      case 'anio':return [String(r.v.year||'Sin año'),String(9999-num(r.v.year))];
      case 'marca':return [r.v.make||'Sin marca',r.v.make||'~'];
      case 'cliente':return [cName(r.c),cName(r.c)];
      default:return [sLabel[r.s.status],r.s.status];
    }
  };
  rows.forEach(r=>{const k=keyOf(r),g=get(k[0],k[1]);g.n++;g.hours+=r.hours;g.labor+=r.t.labor;g.parts+=r.t.parts;g.tot+=r.t.tot;g.total+=r.t.total;g.profit+=r.t.profit});
  const arr=[...m.values()];
  arr.sort((rf.group==='mes'||rf.group==='anio')?(a,b)=>a.sk<b.sk?-1:1:(a,b)=>b.total-a.total);
  const lbl=GROUPS.find(x=>x[0]===rf.group)[1];
  return {head:[lbl,'Servicios','Horas','Mano de obra','Repuestos','TOT','Total'].concat(fin?['Ganancia']:[]),types:['t','i','h','m','m','m','m'].concat(fin?['m']:[]),
    body:arr.map(g=>[g.label,g.n,g.hours,g.labor,g.parts,g.tot,g.total].concat(fin?[g.profit]:[])),
    foot:['Total',sum(arr,g=>g.n),sum(arr,g=>g.hours),sum(arr,g=>g.labor),sum(arr,g=>g.parts),sum(arr,g=>g.tot),sum(arr,g=>g.total)].concat(fin?[sum(arr,g=>g.profit)]:[])};
}
function repDetail(rows,fin){
  const head=['Fecha','Cliente','Placa','Vehículo','Tipo de servicio','Trabajo','Mecánico(s)','Horas','Total'].concat(fin?['Ganancia']:[]).concat(['Estado','Factura']);
  const types=['t','t','t','t','t','t','t','h','m'].concat(fin?['m']:[]).concat(['t','t']);

function grid(head,types,body,foot,ids,max,opts){

  const hc=(t,v)=>esc(f(t,v))+(bsShow(t,v,wb)?'<br><small>'+esc(bsFmt(cellBsVal(v)))+'</small>':'');
  const cls=t=>t==='t'?'':' class="num"';

}

const CRC_T=(()=>{const t=new Uint32Array(256);for(let n=0;n<256;n++){let c=n;for(let k=0;k<8;k++)c=c&1?0xEDB88320^(c>>>1):c>>>1;t[n]=c>>>0}return t})();
function crc32(b){let c=0xFFFFFFFF;for(let i=0;i<b.length;i++)c=CRC_T[(c^b[i])&255]^(c>>>8);return (c^0xFFFFFFFF)>>>0}
function zipFiles(files){
  const enc=new TextEncoder(),parts=[],cent=[];let off=0;
  const u16=n=>[n&255,(n>>>8)&255],u32=n=>[n&255,(n>>>8)&255,(n>>>16)&255,(n>>>24)&255];
  files.forEach(f=>{
    const name=enc.encode(f.name),data=enc.encode(f.text),crc=crc32(data);
    const lh=[0x50,0x4b,3,4,...u16(20),...u16(0x0800),...u16(0),...u16(0),...u16(0x21),...u32(crc),...u32(data.length),...u32(data.length),...u16(name.length),...u16(0)];
    parts.push(new Uint8Array(lh),name,data);
    const ch=[0x50,0x4b,1,2,...u16(20),...u16(20),...u16(0x0800),...u16(0),...u16(0),...u16(0x21),...u32(crc),...u32(data.length),...u32(data.length),...u16(name.length),...u16(0),...u16(0),...u16(0),...u16(0),...u32(0),...u32(off)];
    cent.push(new Uint8Array(ch),name);
    off+=lh.length+name.length+data.length;
  });
  const csize=cent.reduce((t,p)=>t+p.length,0);
  const end=[0x50,0x4b,5,6,...u16(0),...u16(0),...u16(files.length),...u16(files.length),...u32(csize),...u32(off),...u16(0)];
  return new Blob([...parts,...cent,new Uint8Array(end)],{type:'application/vnd.openxmlformats-officedocument.spreadsheetml.sheet'});
}
const xe=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c])).replace(/[\u0000-\u0008\u000B\u000C\u000E-\u001F]/g,'');
function colL(i){let s='';i++;while(i>0){const m=(i-1)%26;s=String.fromCharCode(65+m)+s;i=Math.floor((i-1)/26)}return s}
function sheetXml(rows,widths){
  let x='<?xml version="1.0" encoding="UTF-8" standalone="yes"?><worksheet xmlns="http://schemas.openxmlformats.org/spreadsheetml/2006/main"><sheetViews><sheetView workbookViewId="0"/></sheetViews>';
  if(widths)x+='<cols>'+widths.map((w,i)=>`<col min="${i+1}" max="${i+1}" width="${w}" customWidth="1"/>`).join('')+'</cols>';
  x+='<sheetData>';
  rows.forEach((r,ri)=>{
    x+=`<row r="${ri+1}">`;
    r.forEach((c,ci)=>{
      if(c==null||c==='')return;
      const o=(typeof c==='object')?c:{v:c};
      if(o.v==null||o.v==='')return;
      const ref=colL(ci)+(ri+1),st=o.s?` s="${o.s}"`:'';

    });
    x+='</row>';
  });
  return x+'</sheetData></worksheet>';
}

async function saveFile(blob,filename){
  let dl=null;
  try{if(window.claude&&window.claude.use)dl=await window.claude.use('downloads')}catch(e){dl=null}
  if(dl){
    try{await dl.save({filename,data:blob});toast('Archivo guardado: '+filename);return true}
    catch(e){
      if(e&&e.code==='declined'){toast('Descarga cancelada');return false}
      if(e&&e.code==='rate_limited'){toast('Espera un momento e inténtalo de nuevo');return false}
      if(e&&e.code==='too_large'){toast('El archivo es demasiado grande. Reduce el periodo del reporte');return false}
    }
  }
  try{
    const url=URL.createObjectURL(blob),a=document.createElement('a');
    a.href=url;a.download=filename;document.body.appendChild(a);a.click();a.remove();
    setTimeout(()=>URL.revokeObjectURL(url),5000);toast('Descargando '+filename);return true;
  }catch(e){toast('No se pudo generar el archivo');return false}
}

  const m={};
  if(s&&s.status==='terminado')(s.parts||[]).forEach(p=>{const it=S.catalog.parts[p.desc];if(p.desc&&stockTracked(it))m[p.desc]=(m[p.desc]||0)+num(p.qty)});

function syncStock(s){
  const prev=s.stockUsed||{},next=stockMap(s);
  new Set([...Object.keys(prev),...Object.keys(next)]).forEach(n=>{
    const it=S.catalog.parts[n];if(!stockTracked(it))return;
    it.stock=r2(num(it.stock)+num(prev[n])-num(next[n]));
  });
  s.stockUsed=next;
}

function pdfStr(s){

    if(c>=32&&c<256&&!(c>=0x80&&c<=0x9F))o+=ch;
    else if(CP1252[ch]!=null)o+=String.fromCharCode(CP1252[ch]);
    else if(PDF_SUB[ch]!=null)o+=PDF_SUB[ch];

  }

function charW(ch,b){

  if(c===0x93||c===0x94)return b?500:333;if(c===0x91||c===0x92)return b?278:222;

    const words=par.split(/\s+/).filter(Boolean);

    let line='';
    words.forEach(w=>{
      const t=line?line+' '+w:w;
      if(textW(t,b,sz)<=maxW){line=t;return}
      if(line)out.push(line);
      if(textW(w,b,sz)<=maxW){line=w;return}
      let part='';

    });
    out.push(line);
  });

}

const thr={};
function throttleLeft(k){const t=thr[k];if(!t||!t.until)return 0;const s=Math.ceil((t.until-Date.now())/1000);return s>0?s:0}
function throttleFail(k){const t=thr[k]||(thr[k]={n:0,until:0});t.n++;if(t.n>=5)t.until=Date.now()+30000*Math.min(4,Math.floor(t.n/5))}
function throttleOk(k){delete thr[k]}
function logAct(text){
  const u=me();S.log=S.log||[];
  S.log.unshift({t:Date.now(),u:u?u.name:'—',a:text});
  if(S.log.length>500)S.log.length=500;
}

function passHTML(u){return `<form class="authcard" id="passForm" novalidate><h1>Nueva contraseña</h1><p>Hola, ${esc(u.name)}. Por seguridad debes crear una contraseña propia antes de continuar.</p>${fld('Nueva contraseña (mínimo 6)','n1','','password','autocomplete="new-password"')}${fld('Repetir nueva contraseña','n2','','password','autocomplete="new-password"')}<button class="btn primary" type="submit">Guardar y continuar</button><button type="button" class="btn ghost" data-act="logout">Cerrar sesión</button></form>`}

}
async function doKey(f){
  if(!f.elements.ok.checked)return toast('Marca la casilla cuando hayas guardado tu clave');
  const u=me();if(!u||!pendingKey)return;
  u.recSalt=uid()+uid();u.recHash=await hash(normKey(pendingKey),u.recSalt);
  pendingKey=null;logAct('Activó su clave de recuperación');save();render();
}
async function doPass(f){
  if(CLOUD)return cloudPass(f);
  const u=me();if(!u)return;
  const n1=f.elements.n1.value;
  if(n1.length<6)return toast('La contraseña necesita al menos 6 caracteres');
  if(n1!==f.elements.n2.value)return toast('Las contraseñas no coinciden');
  u.salt=uid()+uid();u.hash=await hash(n1,u.salt);u.mustChange=false;
  logAct('Creó su contraseña propia');save();render();toast('Contraseña guardada');
}
async function doRecover(f){
  if(CLOUD)return cloudRecover(f);
  const code=normCode(f.elements.code.value),em=f.elements.email.value.trim().toLowerCase(),key=normKey(f.elements.key.value),pw=f.elements.pw.value;
  if(!code)return toast('Escribe el código de tu taller');
  if(!isEmail(em))return toast('Escribe tu correo electrónico');
  if(key.length!==16)return toast('La clave de recuperación tiene 16 caracteres (XXXX-XXXX-XXXX-XXXX)');
  if(pw.length<6)return toast('La nueva contraseña necesita al menos 6 caracteres');
  if(pw!==f.elements.pw2.value)return toast('Las contraseñas no coinciden');
  const wait=Math.max(throttleLeft('rec:*'),throttleLeft('rec:'+em));
  if(wait>0)return toast('Demasiados intentos fallidos. Espera '+wait+' segundos');
  const rec=M.shops.find(x=>x.code===code);
  let u=null,isAdm=false;
  if(M.admin&&(M.admin.email||'').toLowerCase()===em){u=M.admin;isAdm=true}
  else if(rec){const d=curShopId===rec.id?S:loadShopData(rec.id);u=d&&d.users.find(x=>(x.email||'').toLowerCase()===em&&x.active!==false)}
  if(!rec||!u||!u.recHash||(await hash(key,u.recSalt))!==u.recHash){throttleFail('rec:'+em);throttleFail('rec:*');return toast('Código, correo o clave de recuperación incorrectos')}
  if(!isAdm){const ac=shopAccess(rec);if(!ac.ok)return toast(ac.msg)}
  throttleOk('rec:'+em);throttleOk('rec:*');
  if(curShopId!==rec.id)openShop(rec.id);else resetUi();
  const uu=isAdm?M.admin:S.users.find(x=>x.id===u.id);
  uu.salt=uid()+uid();uu.hash=await hash(pw,uu.salt);uu.mustChange=false;uu.recHash='';uu.recSalt='';
  setSession(uu.id);uu.lastLogin=new Date().toISOString();authMode='login';view='resumen';pendingKey=null;
  logAct('Recuperó su contraseña con la clave de recuperación');save();render();
  toast('Contraseña actualizada. Ahora genera tu nueva clave de recuperación.');
}
async function resetPw(id){
  if(!need('users.manage'))return;

}

function gqRender(q){
  const box=$('#gres');if(!box)return;

  if(q.length<2){box.innerHTML='<div class="hint">Escribe al menos 2 letras o números.</div>';return}
  const sec=[];
  const sect=(title,items)=>{if(items.length)sec.push(`<h3 style="font-size:18px;margin:10px 0 4px">${esc(title)}</h3><div class="list">${items.join('')}</div>`)};
  const row=(act,id,main,sub)=>`<div class="row click" data-act="${act}" data-id="${esc(id)}"><div class="grow"><div class="t">${esc(main)}</div><div class="s">${esc(sub)}</div></div></div>`;
  if(can('clients.view')){
    sect('Clientes',cMatches(q).slice(0,5).map(c=>row('clientDetail',c.id,cName(c),c.idType+' '+c.idNum+' · '+((c.phones||[])[0]||''))));
    sect('Vehículos',S.vehicles.filter(v=>norm([v.plate,v.vin,v.make,v.model].join(' ')).includes(q)).slice(0,5).map(v=>row('clientDetail',v.clientId,v.plate+' · '+vLabel(v),cName(vOwner(v))+' · '+kmShort(v))));
  }
  if(can('services.view')){
    const hit=S.services.filter(s=>{const v=veh(s.vehicleId)||{};return norm([docNo(s),s.desc,v.plate,cName(vOwner(v)),(s.labor||[]).map(l=>l.desc).join(' ')].join(' ')).includes(q)}).sort((a,b)=>a.date<b.date?1:-1);
    sect('Servicios',hit.filter(s=>!isQuote(s)).slice(0,6).map(s=>row('svcDetail',s.id,docNo(s)+' · '+(s.desc||((s.labor||[])[0]||{}).desc||'Servicio'),(veh(s.vehicleId)||{}).plate+' · '+cName(vOwner(veh(s.vehicleId)))+' · '+sLabel[s.status]+' · '+fmtDate(s.date))));
    sect('Presupuestos',hit.filter(isQuote).slice(0,4).map(s=>row('svcDetail',s.id,docNo(s)+' · '+(s.desc||'Presupuesto'),(veh(s.vehicleId)||{}).plate+' · '+cName(vOwner(veh(s.vehicleId)))+' · '+QLAB[quoteState(s)])));
  }
  if(can('invoices.view')){
    sect('Facturas',S.invoices.filter(i=>norm([i.number,i.control,i.client.name,i.client.idNum,i.veh.plate].join(' ')).includes(q)).slice(0,5).map(i=>row('invDetail',i.id,'Factura '+i.number+' · '+i.client.name,i.veh.plate+' · '+mb(i.total)+' · '+stLabel[invStatus(i)])));
  }
  box.innerHTML=sec.join('')||'<div class="empty">Sin resultados para “'+esc(q)+'”.</div>';
}

/* ---------- Respaldo completo y restauración ---------- */
async function backupAll(){
  if(!need('users.manage'))return;
  const payload={app:'service-tracker',version:4,type:'taller',code:curRec?curRec.code:'',name:S.shop.name,date:new Date().toISOString(),data:S};
  const ok=await saveFile(new Blob([JSON.stringify(payload)],{type:'application/json'}),'respaldo-'+(curRec?curRec.code+'-':'')+today()+'.json');
  if(ok){S.lastBackup=today();logAct('Descargó un respaldo completo del taller');save();render()}
}
function restoreFromFile(file){
  if(!need('users.manage'))return;
  const fr=new FileReader();
  fr.onload=async()=>{
    let o;try{const j=JSON.parse(fr.result);if(j&&j.type==='todo')return toast('Ese archivo es un respaldo de TODOS los talleres. Restáuralo desde el panel Talleres.');o=j&&j.data?j.data:j}catch(e){return toast('El archivo no es un respaldo válido')}
    if(!o||!Array.isArray(o.clients)||!Array.isArray(o.services))return toast('El archivo no parece un respaldo de Service Tracker');
    if(!(await ask('Se reemplazarán TODOS los datos de este taller (incluidos sus usuarios) por los del respaldo. ¿Continuar?','Restaurar')))return;
    const e=shopData(Object.assign({},o,{users:(o.users||[]).filter(u=>!M.admin||(u.email||'').toLowerCase()!==(M.admin.email||'').toLowerCase())}));
    S=e;S.lastBackup=today();S.log=S.log||[];
    S.log.unshift({t:Date.now(),u:'Sistema',a:'Se restauró un respaldo'});
    if(curRec)curRec.name=S.shop.name;
    save();view='resumen';render();
    toast('Respaldo restaurado en este taller');
  };
  fr.readAsText(file);
}
async function backupEverything(){
  if(!need('users.manage'))return;
  if(CLOUD)return cloudBackupAll();
  save();
  const shops={};M.shops.forEach(r=>{const d=r.id===curShopId?S:loadShopData(r.id);if(d){d.lastBackup=today();shops[r.id]=d;if(r.id!==curShopId)lsSet(SPFX+r.id,JSON.stringify(d))}});
  const payload={app:'service-tracker',version:4,type:'todo',date:new Date().toISOString(),master:M,shops};
  const ok=await saveFile(new Blob([JSON.stringify(payload)],{type:'application/json'}),'respaldo-todos-los-talleres-'+today()+'.json');
  if(ok){logAct('Descargó el respaldo de todos los talleres');save();render()}
}
function restoreAll(file){
  if(!need('users.manage'))return;
  if(CLOUD)return toast('Con la nube, la restauración conjunta no está disponible: restaura taller por taller desde Ajustes.');
  const fr=new FileReader();
  fr.onload=async()=>{
    let j;try{j=JSON.parse(fr.result)}catch(e){return toast('El archivo no es un respaldo válido')}
    if(!j||j.type!=='todo'||!j.master||!j.shops||!Array.isArray(j.master.shops)||!j.master.admin)return toast('Ese archivo no es un respaldo de todos los talleres');
    if(!(await ask('Se reemplazarán TODOS los talleres, usuarios y datos actuales por los del respaldo. ¿Continuar?','Restaurar todo')))return;
    M.shops.forEach(r=>lsDel(SPFX+r.id));
    const m=j.master;m.admin=Object.assign({},m.admin,{id:'__admin__',role:'admin',perms:{},active:true});ensureMaster(m);m.shops=m.shops.filter(r=>j.shops[r.id]);
    m.shops.forEach(r=>lsSet(SPFX+r.id,JSON.stringify(shopData(j.shops[r.id]))));
    M=m;lsSet(MKEY,JSON.stringify(M));
    curShopId=null;curRec=null;S=empty();resetUi();setSession(null);render();
    toast('Respaldo restaurado. Inicia sesión con el código de un taller y los datos del administrador del respaldo.');
  };
  fr.readAsText(file);
}
function rateAll(){
  if(!need('users.manage'))return;
  if(CLOUD)return cloudRateAll();
  const re=rateEntry();if(!re)return toast('Primero define la tasa del día en este taller');
  let n=0;
  M.shops.forEach(r=>{
    if(r.id===curShopId)return;
    const d=loadShopData(r.id);if(!d)return;
    d.rates=(d.rates||[]).filter(x=>x.date!==re.date);d.rates.push(Object.assign({},re));
    lsSet(SPFX+r.id,JSON.stringify(d));n++;
  });
  logAct('Aplicó la tasa del día a '+n+' taller(es)');save();render();
  toast('Tasa de Bs. '+fmtRate(re.rate)+' aplicada a '+n+(n===1?' taller':' talleres'));
}
function emailClash(em,u){
  if(u&&u.id==='__admin__'){
    if(S.users.some(x=>(x.email||'').toLowerCase()===em))return true;
    return M.shops.some(r=>{if(r.id===curShopId)return false;const d=loadShopData(r.id);return !!d&&d.users.some(x=>(x.email||'').toLowerCase()===em)});
  }
  if(M.admin&&(M.admin.email||'').toLowerCase()===em)return true;
  return S.users.some(x=>x.id!==(u&&u.id)&&(x.email||'').toLowerCase()===em);
}

const svcMechIds=s=>{const lines=s.labor||[];let ids=lines.map(l=>l.mechanicId||s.mechanicId||'');if(!lines.length)ids=[s.mechanicId||''];return [...new Set(ids)]};
const cellV=v=>(v&&typeof v==='object')?num(v.v):num(v);
const cellOwn=v=>!!(v&&typeof v==='object'&&(v.r||v.b!=null));
const cellBsVal=v=>(v&&typeof v==='object'&&v.b!=null)?num(v.b):cellV(v)*((v&&typeof v==='object'&&v.r)?num(v.r):curRate());
const bsWant=(types,o)=>!(o&&o.nobs)&&(curRate()>0||(o&&o.own))&&!types.includes('b');

const pgDefault=()=>({preset:'todo',from:'',to:'',method:'',mech:'',type:'',q:'',yFrom:'',yTo:'',sort:'fecha_desc'});
let pg=pgDefault(),pgTab='pagados';
const PG_PRESETS=[['mes','Este mes'],['mesant','Mes anterior'],['3m','Últimos 3 meses'],['6m','Últimos 6 meses'],['anio','Este año'],['anioant','Año anterior'],['todo','Todo el historial'],['custom','Personalizado']];
function pgRange(){
  const p=pg.preset;
  if(p==='custom')return [pg.from||'0000-01-01',pg.to||'9999-12-31'];
  const n=new Date(),y=n.getFullYear(),m=n.getMonth(),f=d=>ymd(d);
  if(p==='6m')return [f(new Date(y,m-5,1)),f(new Date(y,m+1,0))];
  if(p==='anioant')return [(y-1)+'-01-01',(y-1)+'-12-31'];
  return periodRange(p);
}
function pgPass(s,v,c,inv){
  const q=norm(pg.q.trim()),ids=svcMechIds(s);
  if(pg.mech&&!(pg.mech==='__none'?ids.includes(''):ids.includes(pg.mech)))return false;
  if(pg.type==='__none'){if(s.type)return false}else if(pg.type&&s.type!==pg.type)return false;
  if(pg.yFrom&&num(v.year)<num(pg.yFrom))return false;
  if(pg.yTo&&num(v.year)>num(pg.yTo))return false;
  if(q&&!norm([docNo(s),inv?inv.number:'',inv?inv.control:'',cName(c),c&&c.idNum,v.plate,v.vin,s.desc].join(' ')).includes(q))return false;
  return true;
}
function paidRows(){
  const [a,b]=pgRange(),out=[];
  S.services.forEach(s=>{
    if(s.status!=='terminado'||isQuote(s))return;
    const inv=invoiceOf(s.id);if(!inv||invStatus(inv)!=='pagada')return;
    const pays=(inv.payments||[]).slice().sort((x,y)=>x.date<y.date?-1:1);
    const last=pays.length?pays[pays.length-1].date:inv.date;
    if(last<a||last>b)return;
    if(pg.method&&!pays.some(p=>p.method===pg.method))return;
    const v=veh(s.vehicleId)||{},c=vOwner(v)||null;
    if(!pgPass(s,v,c,inv))return;
    out.push({s,inv,pays,last,v,c,t:totals(s),cobrado:invPaid(inv),bs:sum(pays,p=>payBs(p,inv)),days:daysBetween(inv.date,last)});
  });
  const so=pg.sort,fin=can('finance.view');
  out.sort((x,y)=>so==='fecha_asc'?(x.last<y.last?-1:1):so==='monto_desc'?y.cobrado-x.cobrado:so==='cliente'?cName(x.c).localeCompare(cName(y.c),'es'):(so==='ganancia_desc'&&fin)?y.t.profit-x.t.profit:(x.last<y.last?1:-1));
  return out;
}
function debtRows(){
  return S.services.filter(s=>s.status==='terminado'&&!isQuote(s)).map(s=>{
    const inv=invoiceOf(s.id),t=totals(s),v=veh(s.vehicleId)||{},c=vOwner(v)||null;
    let state,saldo,paid=0;
    if(!inv){state='Sin facturar';saldo=t.total}
    else{paid=invPaid(inv);saldo=Math.max(0,invSaldo(inv));state=saldo<=0.005?'pagada':(paid>0?'Pago parcial':'Pendiente')}
    return {s,inv,t,v,c,state,saldo,paid,age:Math.max(0,-daysUntil(s.date))};
  }).filter(r=>r.state!=='pagada');
}
function debtList(){
  const rows=debtRows().filter(r=>pgPass(r.s,r.v,r.c,r.inv)),so=pg.sort;
  rows.sort((x,y)=>so==='monto_desc'?y.saldo-x.saldo:so==='cliente'?cName(x.c).localeCompare(cName(y.c),'es'):y.age-x.age);
  return rows;
}
function paidKpis(rows){
  const k={n:rows.length,cobrado:0,bs:0,total:0,ret:0,profit:0,hours:0,days:0,methods:{}};
  rows.forEach(r=>{k.cobrado+=r.cobrado;k.bs+=r.bs;k.total+=r.inv.total;k.ret+=num(r.inv.ivaRet);k.profit+=r.t.profit;k.hours+=sum(r.s.labor||[],l=>num(l.hours));k.days+=r.days;r.pays.forEach(p=>{k.methods[p.method]=(k.methods[p.method]||0)+num(p.usd)})});
  k.avg=k.n?k.cobrado/k.n:0;k.avgDays=k.n?k.days/k.n:0;return k;
}

/* ---------- Historial de servicios: búsqueda por vehículo, cliente y fecha ---------- */
const hsDefault=()=>({q:'',vq:'',cq:'',preset:'todo',from:'',to:'',status:'',type:'',sort:'fecha_desc'});
let hs=hsDefault();
const HS_STATUS=[['','Todos los servicios'],['terminado','Terminados'],['abiertos','Pendientes y en proceso'],['presupuesto','Presupuestos'],['rechazado','Presupuestos rechazados'],['conpres','Servicios y presupuestos']];
const HS_LIMIT=300;
function hsRange(){
  const p=hs.preset;
  if(p==='custom')return [hs.from||'0000-01-01',hs.to||'9999-12-31'];
  const n=new Date(),y=n.getFullYear(),m=n.getMonth(),f=d=>ymd(d);
  if(p==='6m')return [f(new Date(y,m-5,1)),f(new Date(y,m+1,0))];
  if(p==='anioant')return [(y-1)+'-01-01',(y-1)+'-12-31'];
  return periodRange(p);
}
const compact=t=>norm(t).replace(/[^a-z0-9]/g,'');
function hsHit(q,text,comp){
  const toks=norm(q).split(/\s+/).filter(Boolean);
  return toks.every(t=>text.includes(t)||(compact(t)&&comp.includes(compact(t))));
}
function hsVehTxt(v){const t=[v.plate,v.vin,v.make,v.model,v.year,v.color,(v.make||'')+' '+(v.model||'')].join(' ');return [norm(t),compact(t)]}
function hsCliTxt(c){const t=[cName(c),c&&c.idNum,(c&&c.idType||'')+' '+(c&&c.idNum||''),((c&&c.phones)||[]).join(' '),c&&c.email,c&&c.address,c&&c.contact].join(' ');return [norm(t),compact(t)]}
function hsRows(){
  const [a,b]=hsRange(),out=[],gq=hs.q.trim(),vq=hs.vq.trim(),cq=hs.cq.trim();
  S.services.forEach(s=>{
    const st=s.status,f=hs.status;
    if(f===''){if(st==='presupuesto'||st==='rechazado')return}
    else if(f==='abiertos'){if(st!=='pendiente'&&st!=='proceso')return}
    else if(f!=='conpres'&&st!==f)return;
    if(s.date<a||s.date>b)return;
    if(hs.type==='__none'){if(s.type)return}else if(hs.type&&s.type!==hs.type)return;
    const v=veh(s.vehicleId)||{},c=vOwner(v)||null,inv=invoiceOf(s.id);
    const [vt,vc]=hsVehTxt(v),[ct,cc]=hsCliTxt(c||{});
    if(vq&&!hsHit(vq,vt,vc))return;
    if(cq&&!hsHit(cq,ct,cc))return;
    if(gq){
      const extra=[docNo(s),inv?inv.number:'',inv?inv.control:'',s.desc,(s.labor||[]).map(l=>l.desc).join(' '),(s.parts||[]).map(p=>p.desc).join(' ')].join(' ');
      const all=vt+' '+ct+' '+norm(extra),ac=vc+cc+compact(extra);
      if(!hsHit(gq,all,ac))return;
    }
    const t=totals(s);
    const mech=[...new Set((s.labor||[]).map(l=>mechNameOf(s,l)))].filter(x=>x&&x!=='Sin asignar');
    const pay=inv?(stLabel[invStatus(inv)]||'')+' · Fact. '+inv.number:(st==='terminado'?'Sin facturar':'—');
    out.push({s,v,c,t,inv,pay,mech});
  });
  const so=hs.sort,d=x=>x.s.date+String(x.s.onum||0).padStart(6,'0');
  out.sort((x,y)=>so==='fecha_asc'?(d(x)<d(y)?-1:1):so==='cliente'?cName(x.c).localeCompare(cName(y.c),'es'):so==='placa'?String(x.v.plate||'').localeCompare(String(y.v.plate||''),'es'):so==='monto_desc'?y.t.total-x.t.total:(d(x)<d(y)?1:-1));
  return out;
}
function hsKpis(rows){
  const vs=new Set(rows.map(r=>r.v.id)),cs=new Set(rows.map(r=>r.c&&r.c.id));
  return {n:rows.length,veh:vs.size,cli:cs.size,total:sum(rows,r=>r.t.total),hours:sum(rows,r=>sum(r.s.labor||[],l=>num(l.hours))),last:rows.length?rows.map(r=>r.s.date).sort().pop():''};
}
function hsFilterTexts(){
  const t=[],[a,b]=hsRange();
  if(hs.q.trim())t.push('Búsqueda: '+hs.q.trim());
  if(hs.vq.trim())t.push('Vehículo: '+hs.vq.trim());
  if(hs.cq.trim())t.push('Cliente: '+hs.cq.trim());
  if(hs.preset!=='todo')t.push('Fecha: '+(a==='0000-01-01'?'inicio':fmtFull(a))+' al '+(b==='9999-12-31'?'hoy':fmtFull(b)));
  if(hs.status)t.push('Estado: '+(HS_STATUS.find(x=>x[0]===hs.status)||[0,''])[1]);
  if(hs.type)t.push('Tipo: '+(hs.type==='__none'?'Sin clasificar':hs.type));
  return t.length?t:['Sin filtros (todos los servicios)'];
}

  const b=[{t:'head',left:[{b:L.legalName||S.shop.name,size:12},'Generado el '+fmtFull(today())+(rate?' · Tasa: Bs. '+fmtRate(rate)+' por US$ 1':'')],right:[{b:'HISTORIAL DE SERVICIOS',size:16}]},

const SUB_WARN_TRIAL=2,SUB_WARN_PAID=7;
const trialDays=()=>num((M.billing||{}).trialDays)||7;
function subInfo(r){
  const sb=r.sub||{},t=today(),blocked=r.active===false;
  let state,left=null,over=0;
  if(sb.courtesy)state=blocked?'bloqueado':'cortesia';
  else{
    left=sb.expires?dDiff(sb.expires,t):-9999;
    if(blocked)state='bloqueado';
    else if(left<0){state='vencido';over=left===-9999?0:-left}
    else if(sb.paid)state=left<=SUB_WARN_PAID?'porvencer':'activo';
    else state='prueba';
  }
  const ok=!blocked&&(!!sb.courtesy||left>=0);
  const warn=ok&&!sb.courtesy&&(sb.paid?left<=SUB_WARN_PAID:left<=SUB_WARN_TRIAL);
  return {state,ok,left,over,kind:sb.paid?'pago':'prueba',blocked,courtesy:!!sb.courtesy,expires:sb.expires||'',warn};
}

function emailRegistered(em){

function latestRateAnywhere(){
  let best=null;const t=today();

    if(r.id===curShopId)rates=S.rates;

  });
  return best?Object.assign({},best):null;
}

function subRows(){

const CH_SIZE=250000;
const chunkHash=t=>{let h=5381;for(let i=0;i<t.length;i++)h=((h<<5)+h+t.charCodeAt(i))|0;return (h>>>0).toString(36)+'.'+t.length.toString(36)};
const splitChunks=j=>{const a=[];for(let i=0;i<j.length;i+=CH_SIZE)a.push(j.slice(i,i+CH_SIZE));return a.length?a:['']};

/* --- lectura y escritura de los datos de un taller (JSON troceado) --- */
async function cloudReadData(id){
  for(let t=0;t<4;t++){
    const m=await fdb.doc(dpath(id,'meta')).get();
    if(!m.exists)return null;
    const md=m.data(),n=md.n||0;
    const snaps=await Promise.all(Array.from({length:n},(_,i)=>fdb.doc(dpath(id,'c'+i)).get()));
    if(snaps.every((x,i)=>x.exists&&x.data().h===(md.hs||[])[i]))return {meta:md,json:snaps.map(x=>x.data().d).join('')};
    await new Promise(r=>setTimeout(r,500));
  }
  throw new Error('datos-inconsistentes');
}
async function cloudWriteInit(id,d){
  const chunks=splitChunks(JSON.stringify(d)),h=chunks.map(chunkHash);
  for(let a=0;a<chunks.length;a+=4){const b=fdb.batch();chunks.slice(a,a+4).forEach((c,k)=>b.set(fdb.doc(dpath(id,'c'+(a+k))),{d:c,h:h[a+k]}));await b.commit()}
  await fdb.doc(dpath(id,'meta')).set({ver:1,n:chunks.length,hs:h,by:cloud.clientId,updatedAt:firebase.firestore.FieldValue.serverTimestamp(),stats:statsOf(d)});
}
function cloudQueue(ms){clearTimeout(cloud.timer);cloud.timer=setTimeout(cloudFlush,ms==null?1200:ms)}
async function cloudFlush(){
  if(!CLOUD||!curShopId||!cloud.dirty)return;
  if(cloud.busy){cloud.again=true;return}
  cloud.busy=true;cloud.dirty=false;
  const id=curShopId;
  try{
    const mref=fdb.doc(dpath(id,'meta')),m=await mref.get();
    if(m.exists&&m.data().ver!==cloud.ver){cloud.busy=false;await cloudConflict(id);return}
    const chunks=splitChunks(JSON.stringify(S)),h=chunks.map(chunkHash),ver=cloud.ver+1;
    const changed=[];chunks.forEach((c,i)=>{if(h[i]!==cloud.lastHashes[i])changed.push(i)});
    for(let a=0;a<changed.length;a+=4){const b=fdb.batch();changed.slice(a,a+4).forEach(i=>b.set(fdb.doc(dpath(id,'c'+i)),{d:chunks[i],h:h[i]}));await b.commit()}
    await mref.set({ver,n:chunks.length,hs:h,by:cloud.clientId,updatedAt:firebase.firestore.FieldValue.serverTimestamp(),stats:statsOf(S)});
    const old=cloud.lastHashes.length;
    for(let a=chunks.length;a<old;a+=4){const b=fdb.batch();for(let j=a;j<Math.min(a+4,old);j++)b.delete(fdb.doc(dpath(id,'c'+j)));await b.commit()}
    cloud.ver=ver;cloud.lastHashes=h;cloud.retry=0;
    if(curRec&&curRec.id===id)curRec.stats=statsOf(S);
  }catch(e){
    cloud.dirty=true;cloud.retry++;cloud.busy=false;
    toast('No se pudo guardar en la nube ('+cloudErr(e)+'). Reintentando…');
    cloud.timer=setTimeout(cloudFlush,Math.min(30000,3000*cloud.retry));return;
  }
  cloud.busy=false;
  if(cloud.dirty||cloud.again){cloud.again=false;cloudQueue(300)}
}
async function cloudFlushNow(){
  clearTimeout(cloud.timer);let n=0;
  while((cloud.dirty||cloud.busy)&&n++<60){if(cloud.busy)await new Promise(r=>setTimeout(r,150));else await cloudFlush()}
}
async function cloudReload(id){
  const r=await cloudReadData(id);if(!r)return;
  S=shopData(JSON.parse(r.json));cloud.ver=r.meta.ver;cloud.lastHashes=r.meta.hs||[];cloud.dirty=false;

function cloudDetach(){cloud.unsub.forEach(u=>{try{u()}catch(e){}});cloud.unsub=[]}

function cloudAttach(id){
  cloudDetach();
  cloud.unsub.push(fdb.doc(dpath(id,'meta')).onSnapshot(async snap=>{
    if(!snap.exists||snap.metadata.hasPendingWrites)return;
    const md=snap.data();
    if(md.by!==cloud.clientId&&md.ver>cloud.ver&&!cloud.dirty&&!cloud.busy){try{await cloudReload(id)}catch(e){}}
  },()=>cloudDenied()));
  if(meId!=='__admin__'){
    let wasOk=true;
    cloud.unsub.push(fdb.doc('shops/'+id).onSnapshot(async snap=>{
      if(!snap.exists){toast('Este taller fue eliminado');return cloudLogout()}
      const n=recFrom(id,snap.data());
      if(curRec&&recKey(n)!==recKey(curRec)){
        Object.assign(curRec,n,{stats:curRec.stats});
        const ok=shopAccess(curRec).ok;
        if(ok&&!wasOk){try{await cloudReload(id);cloudAttach(id)}catch(e){}}
        wasOk=ok;render();
      }
    },()=>{}));
  }
}

async function cloudSaveMaster(){
  if(!CLOUD||meId!=='__admin__')return;
  if(cloud.mBusy){cloud.mAgain=true;return}
  cloud.mBusy=true;
  try{
    for(const r of M.shops.slice()){
      const k=recKey(r);if(cloud.lastRec[r.id]===k)continue;
      const b=fdb.batch();b.set(fdb.doc('shops/'+r.id),recDoc(r));
      const oc=cloud.lastCode[r.id];
      if(oc&&oc!==r.code){b.delete(fdb.doc('codes/'+oc));b.set(fdb.doc('codes/'+r.code),{shopId:r.id})}
      await b.commit();cloud.lastRec[r.id]=k;cloud.lastCode[r.id]=r.code;
    }
    const bk=JSON.stringify(M.billing);
    if(bk!==cloud.lastBilling){await fdb.doc('config/billing').set(M.billing);cloud.lastBilling=bk}
    if(M.admin&&M.admin.name!==cloud.lastAdminName){await fdb.doc('config/admin').update({name:M.admin.name});await fdb.doc('config/public').update({adminName:M.admin.name});cloud.lastAdminName=M.admin.name}
  }catch(e){toast('No se pudo guardar en la nube: '+cloudErr(e))}
  finally{cloud.mBusy=false;if(cloud.mAgain){cloud.mAgain=false;cloudMasterQueue()}}
}

async function cloudShopDel(id){
  const r=M.shops.find(x=>x.id===id);if(!r)return;
  if(normCode(($('#mf [name=delcode]')||{}).value)!==r.code)return toast('El código no coincide');
  if(M.shops.length<2)return toast('No puedes eliminar el único taller');
  const name=r.name,wasCur=curShopId===id;
  try{
    if(wasCur)await cloudFlushNow();
    cloudDetach();
    const meta=await fdb.doc(dpath(id,'meta')).get(),n=meta.exists?(meta.data().n||0):0;
    for(let a=0;a<n;a+=4){const b=fdb.batch();for(let j=a;j<Math.min(a+4,n);j++)b.delete(fdb.doc(dpath(id,'c'+j)));await b.commit()}
    await fdb.doc(dpath(id,'meta')).delete();
    const us=await fdb.collection('users').where('shopId','==',id).get();
    for(const d of us.docs)await d.ref.delete();
    await fdb.doc('codes/'+r.code).delete();await fdb.doc('shops/'+id).delete();
  }catch(e){return toast('No se pudo eliminar: '+cloudErr(e))}
  M.shops=M.shops.filter(x=>x.id!==id);delete cloud.lastRec[id];delete cloud.lastCode[id];
  if(wasCur){curShopId=null;curRec=null;await openShopC(M.shops[0].id);meId='__admin__'}
  logAct('Eliminó el taller '+name);closeDlg();save();render();toast('Taller «'+name+'» eliminado');
}

  cloud.rate={date:re.date,rate:re.rate};logAct('Publicó la tasa del día para todos los talleres');save();render();

async function cloudBackupAll(){

  const ok=await saveFile(new Blob([JSON.stringify(payload)],{type:'application/json'}),'respaldo-todos-los-talleres-'+today()+'.json');

function provPay(id){
  const mine=payables().filter(p=>p.provId===id);
  const pend=sum(mine,p=>p.amount);
  let paid=0;
  S.services.forEach(s=>(s.tot||[]).forEach(t=>{if(t.providerId===id&&t.paid)paid+=num(t.cost)}));
  S.expenses.forEach(e=>{if(e.providerId===id&&e.paid)paid+=num(e.amount)});
  return {pend,paid};
}

  let tot=$$('.line.tot',form).map(r=>{const paid=$('.tpaid',r).checked;return {id:r.dataset.lid,desc:$('.ld',r).value.trim(),providerId:$('.tp',r).value,cost:num($('.tc',r).value),price:num($('.lp',r).value),paid,paidDate:paid?(r.dataset.pd||today()):'',method:r.dataset.pm||'',ref:r.dataset.pr||''}});

function invItems(s){
  const it=[];
  (s.labor||[]).forEach(l=>{if(l.desc||num(l.price))it.push({kind:'Mano de obra',desc:(l.desc||'Mano de obra')+(num(l.hours)?' ('+fHrs(l.hours)+' h)':''),qty:1,price:num(l.price)})});

  (s.tot||[]).forEach(t=>{if(t.desc||num(t.price))it.push({kind:'Trabajos de terceros (TOT)',desc:t.desc||'Trabajo de terceros',qty:1,price:num(t.price)})});

}
function calcInv(items,ivaApply,ivaRate,igtfApply,igtfRate){
  const base=r2(sum(items,i=>num(i.qty)*num(i.price)));
  const iva=ivaApply?r2(base*num(ivaRate)/100):0;
  const igtf=igtfApply?r2((base+iva)*num(igtfRate)/100):0;
  return {base,iva,igtf,total:r2(base+iva+igtf)};
}

   fld('Referencia o comprobante','ref','','text','','full'),

/* ---------- Contabilidad ---------- */
const PERIODS=[['mes','Este mes'],['mesant','Mes anterior'],['3m','Últimos 3 meses'],['anio','Este año'],['todo','Todo']];
function periodRange(p){
  const n=new Date(),y=n.getFullYear(),m=n.getMonth(),f=d=>ymd(d);
  if(p==='mes')return [f(new Date(y,m,1)),f(new Date(y,m+1,0))];
  if(p==='mesant')return [f(new Date(y,m-1,1)),f(new Date(y,m,0))];
  if(p==='3m')return [f(new Date(y,m-2,1)),f(new Date(y,m+1,0))];
  if(p==='anio')return [y+'-01-01',y+'-12-31'];
  return ['0000-01-01','9999-12-31'];
}
function acData(p){
  const [a,b]=periodRange(p),inR=d=>d>=a&&d<=b;
  const svcs=S.services.filter(s=>s.status==='terminado'&&inR(s.date)),T=svcs.map(totals);
  const d={n:svcs.length,ing:sum(T,t=>t.total),labor:sum(T,t=>t.labor),parts:sum(T,t=>t.parts),tot:sum(T,t=>t.tot),cparts:sum(T,t=>t.cparts),ctot:sum(T,t=>t.ctot)};
  d.gross=d.ing-d.cparts-d.ctot;
  d.exps=S.expenses.filter(e=>inR(e.date)).sort((x,y)=>x.date<y.date?1:-1);
  d.opex=sum(d.exps,e=>num(e.amount));d.net=d.gross-d.opex;d.margin=d.ing?d.net/d.ing*100:0;
  d.invAll=S.invoices.filter(i=>inR(i.date)).sort((x,y)=>x.number<y.number?-1:1);
  const live=d.invAll.filter(i=>i.status!=='anulada');
  d.fact=sum(live,i=>i.total);d.base=sum(live,i=>i.base);d.ivaDeb=sum(live,i=>i.iva);d.igtf=sum(live,i=>i.igtf);d.ivaCred=sum(d.exps,e=>num(e.iva));d.ivaRet=sum(live,i=>num(i.ivaRet));
  d.pays=[];S.invoices.forEach(i=>{if(i.status!=='anulada')(i.payments||[]).forEach(pp=>{if(inR(pp.date))d.pays.push(Object.assign({inv:i},pp))})});
  d.cobrado=sum(d.pays,x=>x.usd);d.byMethod={};d.pays.forEach(x=>{d.byMethod[x.method]=(d.byMethod[x.method]||0)+x.usd});
  d.cats={};d.exps.forEach(e=>{d.cats[e.category]=(d.cats[e.category]||0)+num(e.amount)});
  d.porCobrar=sum(S.invoices.filter(i=>i.status!=='anulada'),i=>Math.max(0,invSaldo(i)));
  d.porPagar=sum(payables(),x=>x.amount);
  const cl={};svcs.forEach(s=>{const c=vOwner(veh(s.vehicleId));const k=cName(c);cl[k]=(cl[k]||0)+totals(s).total});
  d.topClients=Object.keys(cl).map(k=>[k,cl[k]]).sort((x,y)=>y[1]-x[1]).slice(0,5);
  return d;
}
function vContabilidad(){
  const tabs=[['resumen','Resumen'],['cobranzas','Cobranzas'],['gastos','Gastos'],['pagar','Por pagar'],['libro','Libro de ventas']];
  let h=head('Contabilidad','Resultados, cobranzas, gastos, cuentas por pagar e IVA (referencial)',can('accounting.manage')?'<button class="btn primary" data-act="newExp">Registrar gasto</button>':'');
  h+=`<div class="toolbar">${chipsHTML(tabs,acTab,'acTab','t')}</div>`;
  if(['resumen','gastos','libro'].includes(acTab))h+=`<div class="toolbar">${chipsHTML(PERIODS,acPeriod,'acPeriod','p')}</div>`;
  const d=acData(acPeriod);
  if(acTab==='resumen')h+=acResumen(d);
  else if(acTab==='cobranzas')h+=acCobranzas();
  else if(acTab==='gastos')h+=acGastos(d);
  else if(acTab==='pagar')h+=acPagar();
  else h+=acLibro(d);
  return h;
}

   <h3 style="margin-top:16px">Principales clientes</h3>${d.topClients.length?d.topClients.map(c=>`<div class="brow"><span>${esc(c[0])}</span><i style="width:${Math.max(2,c[1]/d.topClients[0][1]*100)}%"></i><b>${bi(c[1])}</b></div>`).join(''):'<div class="empty">Sin datos.</div>'}</section></div>
  <section class="panel"><h3>IVA del periodo (referencial)</h3><div class="stmt"><div><span>Base imponible facturada</span><span>${bi(d.base)}</span></div><div><span>IVA cobrado en facturas (débito fiscal)</span><span>${bi(d.ivaDeb)}</span></div><div><span>IVA pagado en gastos (crédito fiscal)</span><span>${bi(d.ivaCred)}</span></div><div><span>IVA retenido por clientes (a tu favor)</span><span>${bi(d.ivaRet)}</span></div><div class="tot"><span>IVA estimado por pagar</span><b>${both(d.ivaDeb-d.ivaCred-d.ivaRet)}</b></div><div><span>IGTF cobrado</span><span>${bi(d.igtf)}</span></div></div><p class="hint" style="margin-top:10px">Cálculo informativo para apoyar a tu contador; no sustituye la declaración fiscal.</p></section>`;

function acCobranzas(){

function expForm(id){
  if(!can('accounting.manage'))return denied();
  const e=id?S.expenses.find(x=>x.id===id):{date:today(),category:EXP_CATS[0],paid:true,method:'Transferencia',amount:'',iva:''};
  modal(id?'Editar gasto':'Registrar gasto',
   fld('Fecha','date',e.date,'date')+sel('Categoría','category',EXP_CATS.map(c=>[c,c]),e.category)+
   fld('Descripción','desc',e.desc,'text','placeholder="Ej. Pago de alquiler de octubre"','full')+
   sel('Proveedor (opcional)','providerId',provOpts(),e.providerId||'','full')+
   sel('Moneda','cur',[['USD','Dólares (US$)'],['Bs','Bolívares (Bs.)']],'USD')+fld('Monto','amount',e.amount,'number','min="0" step="0.01"')+
   fld('IVA incluido (crédito fiscal, opcional)','iva',e.iva,'number','min="0" step="0.01"')+sel('Estado','paid',[['1','Pagado'],['0','Por pagar']],e.paid?'1':'0')+
   sel('Método de pago','method',PAY_METHODS.map(m=>[m,m]),e.method||'Transferencia')+fld('Referencia','ref',e.ref,'text')+
   fld('Fecha de vencimiento (si queda por pagar)','due',e.due,'date','','full'),
   {onSave:fd=>{
     let amt=num(fd.amount),iva=num(fd.iva);
     if(amt<=0)return toast('Escribe un monto mayor que cero'),false;
     if(fd.cur==='Bs'){const r=curRate();if(!r)return toast('Define la tasa del día para registrar montos en bolívares'),false;amt=r2(amt/r);iva=r2(iva/r)}
     const o=id?e:{id:uid()};
     const paid=fd.paid==='1';
     Object.assign(o,{date:fd.date||today(),category:fd.category,desc:(fd.desc||'').trim(),providerId:fd.providerId||'',amount:amt,iva,paid,paidDate:paid?(o.paidDate||fd.date||today()):'',method:paid?fd.method:'',ref:(fd.ref||'').trim(),due:paid?'':(fd.due||'')});
     if(!id)S.expenses.push(o);toast(id?'Gasto actualizado':'Gasto registrado');
   },extra:id?`<button type="button" class="btn danger" data-act="delExp" data-id="${id}">Eliminar</button>`:''});
}
function markPaid(k,id,lid){
  if(!need('accounting.manage'))return;
  modal('Marcar como pagado',fld('Fecha de pago','date',today(),'date')+sel('Método','method',PAY_METHODS.map(m=>[m,m]),'Transferencia')+fld('Referencia','ref','','text','','full'),
   {onSave:fd=>{
     if(k==='exp'){const e=S.expenses.find(x=>x.id===id);if(e)Object.assign(e,{paid:true,paidDate:fd.date||today(),method:fd.method,ref:(fd.ref||'').trim(),due:''})}
     else{const s=S.services.find(x=>x.id===id);const t=s&&(s.tot||[]).find(x=>x.id===lid);if(t)Object.assign(t,{paid:true,paidDate:fd.date||today(),method:fd.method,ref:(fd.ref||'').trim()})}
     toast('Pago registrado');
   }});
}
