function readInvForm(){
  const f=$('#invf'),L=Object.assign({},S.inv),g=n=>rd(f,n);
  ['legalName','tradeName','rif','address','phones','email','activity','docTitle','invPrefix','ctrlPrefix','ctrlFrom','ctrlTo','printerName','printerRif','printerAuth','printerDate','payTerms','bank','notes','legend'].forEach(k=>{L[k]=g(k)});
  ['nextInv','nextCtrl'].forEach(k=>{L[k]=Math.max(1,num(g(k))||1)});
  ['ivaRate','igtfRate'].forEach(k=>{L[k]=num(g(k))});L.quoteDays=Math.max(1,num(g('quoteDays'))||7);
  L.ivaDefault=f.elements.ivaDefault.checked;L.showBs=f.elements.showBs.checked;
  L.logo=logoDraft!==null?logoDraft:S.inv.logo;
  return L;
}
function previewInv(){
  const L=readInvForm();
  const items=[{kind:'Mano de obra',desc:'Cambio de aceite y filtro',qty:1,price:15},{kind:'Repuestos',desc:'Filtro de aceite',qty:1,price:8},{kind:'Repuestos',desc:'Aceite 10W-40 (litro)',qty:4,price:6},{kind:'Trabajos de terceros (TOT)',desc:'Rectificación de cabezote',qty:1,price:140}];
  const cc=calcInv(items,L.ivaDefault,L.ivaRate,false,L.igtfRate),r=curRate()||1;
  const legal=Object.assign({},L);delete legal.logo;
  const inv={number:(L.invPrefix||'')+String(L.nextInv).padStart(6,'0'),control:(L.ctrlPrefix||'')+String(L.nextCtrl).padStart(6,'0'),date:today(),
   client:{name:'Cliente de ejemplo',idType:'Cédula de identidad',idNum:'V-12345678',address:'Dirección del cliente',phone:'0414-5550000'},veh:{plate:'AB123CD',desc:'Toyota Corolla 2018',vin:'9BR53ZEC4J8123456',km:84200},
   items,ivaApply:L.ivaDefault,ivaRate:L.ivaRate,igtfApply:false,igtfRate:L.igtfRate,base:cc.base,iva:cc.iva,igtf:0,total:cc.total,rate:r,rateDate:today(),cond:L.payTerms||'Contado',days:0,notes:L.notes,status:'emitida',payments:[],legal};
  const keep=S.inv.logo;S.inv.logo=L.logo;
  modal('Vista previa de la factura',`<div class="full">${invoiceHTML(inv)}</div><div class="full hint">Datos de ejemplo.${curRate()?'':' Sin tasa definida, se usa Bs. 1,00 solo para esta vista previa.'}</div>`,{wide:true});
  S.inv.logo=keep;
}
function saveInvSettings(){
  if(!need('invoice.settings'))return;
  const L=readInvForm();
  if(!L.legalName)return toast('Escribe la razón social');
  if(!L.rif)return toast('Escribe el RIF del emisor');
  if(L.ctrlTo&&num(L.nextCtrl)>num(L.ctrlTo))return toast('El próximo N° de control supera el límite autorizado');
  S.inv=L;logoDraft=null;save();render();toast('Datos de facturación guardados');
}

/* ---------- Citas ---------- */
function vCitas(){
  const mg=can('appts.manage');
  let h=head('Citas','Agenda de ingresos al taller',mg?'<button class="btn primary" data-act="newAppt">Nueva cita</button>':'');
  const byDT=(a,b)=>(a.date+a.time)<(b.date+b.time)?-1:1;
  const up=S.appts.filter(a=>a.date>=today()&&a.status!=='cancelada').sort(byDT);
  const past=S.appts.filter(a=>a.date<today()||a.status==='cancelada').sort((a,b)=>-byDT(a,b)).slice(0,15);
  if(!up.length)h+='<div class="panel" style="margin-bottom:14px"><div class="empty">No hay citas próximas.'+(mg?' Agenda la primera con “Nueva cita”.':'')+'</div></div>';
  const groups={};up.forEach(a=>{(groups[a.date]=groups[a.date]||[]).push(a)});
  Object.keys(groups).sort().forEach(d=>{
    h+=`<section class="panel" style="margin-bottom:14px"><h3>${esc(fmtLong(d))}</h3><div class="list">${groups[d].map(a=>{
      const v=veh(a.vehicleId);
      return `<div class="row"><div class="time">${esc(a.time)}</div><div class="grow"><div class="t">${esc(a.reason||'Cita')}</div><div class="s">${esc(cName(vOwner(v)))} · ${esc(vLabel(v))}</div></div>${plate(v)}<span class="tag ${a.status}">${aLabel[a.status]}</span>${a.status==='programada'&&can('services.create')?`<button class="btn sm primary" data-act="apptStart" data-id="${a.id}">Iniciar servicio</button>`:''}${mg?`<button class="btn sm" data-act="editAppt" data-id="${a.id}">Editar</button>`:''}</div>`;
    }).join('')}</div></section>`;
  });
  if(past.length)h+=`<section class="panel"><h3>Anteriores</h3><div class="list">${past.map(a=>{const v=veh(a.vehicleId);return `<div class="row ${mg?'click':''}" data-act="${mg?'editAppt':''}" data-id="${a.id}"><div class="s" style="min-width:70px">${esc(fmtDate(a.date))}</div><div class="grow"><div class="t">${esc(a.reason||'Cita')}</div><div class="s">${esc(cName(vOwner(v)))} · ${esc(vLabel(v))}</div></div>${plate(v)}<span class="tag ${a.status}">${aLabel[a.status]}</span></div>`}).join('')}</div></section>`;
  return h;
}
function needVeh(){
  if(S.vehicles.length)return false;
  modal('Primero registra un cliente con vehículo','<div class="full">Para crear citas o recordatorios necesitas al menos un vehículo registrado.</div>',{extra:can('clients.edit')?'<button type="button" class="btn primary" data-act="newClient">Registrar cliente</button>':''});
  return true;

/* ---------- Recordatorios ---------- */
function vRecordatorios(){
  const mg=can('reminders.manage');
  let h=head('Recordatorios','Próximos mantenimientos para avisar a tus clientes',mg?'<button class="btn primary" data-act="newRem">Nuevo recordatorio</button>':'');
  const a=S.reminders.slice().sort((a,b)=>a.done!==b.done?(a.done?1:-1):(a.date<b.date?-1:1));
  if(!a.length)return h+'<div class="panel"><div class="empty">No hay recordatorios. Se crean al guardar un servicio con “Próximo servicio”, o manualmente.</div></div>';
  h+=`<section class="panel"><div class="list">${a.map(r=>{
    const v=veh(r.vehicleId),st=rState(r);
    return `<div class="row" style="${r.done?'opacity:.6':''}"><div class="grow"><div class="t">${esc(r.text)}</div><div class="s">${esc(cName(vOwner(v)))} · ${esc(vLabel(v))} · ${esc(rWhen(r))}</div></div>${plate(v)}<span class="tag ${st}">${rLabel[st]}</span>${!r.done?`<button class="btn sm" data-act="copyRem" data-id="${r.id}">Copiar aviso</button>${waRem(r)}`:''}${mg?(!r.done?`<button class="btn sm primary" data-act="remDone" data-id="${r.id}">Hecho</button>`:'')+`<button class="btn sm danger" data-act="remDel" data-id="${r.id}">Eliminar</button>`:''}</div>`;
  }).join('')}</div></section>`;
  return h;
}
function remForm(){
  if(!can('reminders.manage'))return denied();
  if(needVeh())return;
  modal('Nuevo recordatorio',sel('Cliente y vehículo','vehicleId',S.vehicles.map(vSel),S.vehicles[0].id,'full')+
   fld('Qué hay que recordar','text','','text','placeholder="Ej. Cambio de aceite a los 5.000 km"','full')+fld('Fecha del aviso','date',addDays(30),'date','','full'),
   {onSave:fd=>{
     if(!(fd.text||'').trim())return toast('Escribe qué hay que recordar'),false;
     S.reminders.push({id:uid(),vehicleId:fd.vehicleId,date:fd.date||addDays(30),text:fd.text.trim(),done:false});toast('Recordatorio creado');
   }});
}

function myAccount(){
  const u=me();if(!u)return;
  if(CLOUD)return myAccountCloud();
  modal('Mi cuenta',
   fld('Nombre completo','name',u.name,'text','','full')+
   fld('Correo electrónico (con él ingresas)','email',u.email,'email','autocapitalize="none" autocomplete="off"','full')+
   '<div class="full hint">Para cambiar el correo, la contraseña o la clave de recuperación escribe tu contraseña actual.</div>'+
   fld('Contraseña actual','cur','','password','autocomplete="current-password"','full')+
   fld('Nueva contraseña (opcional, mínimo 6)','n1','','password','autocomplete="new-password"')+fld('Repetir nueva contraseña','n2','','password','autocomplete="new-password"')+
   chk('Generar una nueva clave de recuperación (invalida la anterior)','newkey',false,'full'),
   {onSave:async fd=>{
     const name=(fd.name||'').trim(),email=(fd.email||'').trim().toLowerCase();
     if(!name)return toast('Escribe tu nombre'),false;
     if(!isEmail(email))return toast('Escribe un correo electrónico válido'),false;
     if(emailClash(email,u))return toast('Ese correo ya está en uso por otro usuario'),false;
     const emailChanged=email!==(u.email||'').toLowerCase(),pwChanged=!!fd.n1,newkey=!!fd.newkey;
     if(emailChanged||pwChanged||newkey){
       const wait=throttleLeft('acct:'+u.id);
       if(wait>0)return toast('Demasiados intentos. Espera '+wait+' segundos'),false;
       if((await hash(fd.cur||'',u.salt))!==u.hash){throttleFail('acct:'+u.id);return toast('La contraseña actual no es correcta'),false}
       throttleOk('acct:'+u.id);
     }
     if(pwChanged){
       if(fd.n1.length<6)return toast('La nueva contraseña necesita al menos 6 caracteres'),false;
       if(fd.n1!==fd.n2)return toast('Las contraseñas nuevas no coinciden'),false;
       u.salt=uid()+uid();u.hash=await hash(fd.n1,u.salt);u.mustChange=false;
     }
     u.name=name;u.email=email;u.username=email;
     if(newkey){u.recHash='';u.recSalt='';pendingKey=null}
     logAct('Actualizó su cuenta'+(emailChanged?' (correo)':'')+(pwChanged?' (contraseña)':'')+(newkey?' (clave de recuperación)':''));
     toast('Cuenta actualizada'+(newkey?'. Genera tu nueva clave de recuperación.':''));
   }});
}

  addVeh:()=>{$('#vehList').insertAdjacentHTML('beforeend',vehBlock(null));const b=$$('.vb',$('#vehList')).pop();const i=$('input',b);if(i){i.focus();b.scrollIntoView({block:'center'})}},
  rmVeh:(d,el)=>{const b=el.closest('.vb');if(b.dataset.used==='1')return toast('Este vehículo tiene servicios registrados y no se puede quitar');b.remove()},
  delClient:async d=>{
    if(!need('clients.delete'))return;
    const vs=cVehs(d.id);

    if(await ask('¿Eliminar este cliente y sus vehículos?','Eliminar')){const ids=vs.map(v=>v.id);S.clients=S.clients.filter(c=>c.id!==d.id);S.vehicles=S.vehicles.filter(v=>v.clientId!==d.id);S.appts=S.appts.filter(a=>!ids.includes(a.vehicleId));S.reminders=S.reminders.filter(r=>!ids.includes(r.vehicleId));save();go('clientes');toast('Cliente eliminado')}

  /* proveedores */
  newProv:()=>provForm(),
  editProv:d=>provForm(d.id),
  provDetail:d=>provDetail(d.id),
  newProvFromService:()=>provForm(),
  delProv:async d=>{
    if(!need('providers.edit'))return;
    const used=S.services.some(s=>(s.tot||[]).some(t=>t.providerId===d.id))||S.expenses.some(e=>e.providerId===d.id);
    if(used)return toast('El proveedor tiene trabajos o gastos asociados y no se puede eliminar');
    if(await ask('¿Eliminar este proveedor?','Eliminar')){S.providers=S.providers.filter(p=>p.id!==d.id);closeDlg();save();render();toast('Proveedor eliminado')}
  },
  /* servicios */
  newService:()=>go('servicioForm'),
  newServiceFor:d=>{closeDlg();go('servicioForm',{clientId:d.id})},
  editService:d=>{closeDlg();go('servicioForm',{id:d.id})},
  svcDetail:d=>{if(d.id&&can('services.view'))svcDetail(d.id)},
  delService:async d=>{
    if(!need('services.delete'))return;
    if(isLocked(S.services.find(x=>x.id===d.id)))return toast('Los servicios terminados no se pueden eliminar.');
    if(invoiceOf(d.id))return toast('El servicio tiene una factura emitida. Anula la factura primero.');
    if(await ask('¿Eliminar este servicio?','Eliminar')){const sv0=S.services.find(s=>s.id===d.id);if(sv0){logAct('Eliminó el servicio '+docNo(sv0));sv0.status='pendiente';syncStock(sv0)}S.services=S.services.filter(s=>s.id!==d.id);S.reminders=S.reminders.filter(r=>r.serviceId!==d.id);save();sd=null;go('servicios');toast('Servicio eliminado')}
  },
  pickClient:d=>{sd.clientId=d.id;const vs=cVehs(d.id);sd.vehicleId=vs.length===1?vs[0].id:'';$('#cliPick').innerHTML=pickHTML();updKmHint()},
  changeClient:()=>{sd.clientId='';sd.vehicleId='';$('#cliPick').innerHTML=pickHTML();const i=$('#cs');if(i)i.focus()},
  addLabor:()=>{$('#labList').insertAdjacentHTML('beforeend',laborRow({}));const r=$$('.line.lab').pop();$('.ld',r).focus()},
  addPart:()=>{$('#partList').insertAdjacentHTML('beforeend',partRow({qty:1}));const r=$$('.line.prt').pop();$('.ld',r).focus()},
  addTot:()=>{$('#totList').insertAdjacentHTML('beforeend',totRow({}));const r=$$('.line.tot').pop();$('.ld',r).focus()},
  rmLine:(d,el)=>{el.closest('.rowx').remove();updTotals()},
  filter:d=>{filter=d.f;render()},
  /* facturas y contabilidad */
  invForm:d=>invForm(d.id),
  invDetail:d=>{if(can('invoices.view')||can('accounting.view'))invDetail(d.id)},
  invFilter:d=>{invFilter=d.f;render()},
  printInv:d=>{
    const inv=S.invoices.find(x=>x.id===d.id);if(!inv)return;
    $('#printArea').innerHTML=invoiceHTML(inv);
    try{window.print()}catch(e){toast('No se pudo abrir la impresión. Usa Ctrl+P')}
  },
  payInv:d=>payInv(d.id),
  delPay:async d=>{
    if(!need('invoices.pay'))return;const inv=S.invoices.find(x=>x.id===d.id);if(!inv)return;
    if(await ask('¿Quitar este cobro de la factura?','Quitar')){inv.payments=inv.payments.filter(p=>p.id!==d.pid);save();render();invDetail(inv.id)}
  },
  voidInv:async d=>{
    if(!need('invoices.void'))return;const inv=S.invoices.find(x=>x.id===d.id);if(!inv)return;
    if((inv.payments||[]).length)return toast('Quita primero los cobros registrados para anular la factura');
    if(await ask('¿Anular la factura N° '+inv.number+'? No se elimina: queda registrada como anulada y el servicio puede volver a facturarse.','Anular')){inv.status='anulada';inv.voidDate=today();logAct('Anuló la factura '+inv.number);save();render();invDetail(inv.id);toast('Factura anulada')}
  },
  acTab:d=>{acTab=d.t;render()},
  acPeriod:d=>{acPeriod=d.p;render()},
  newExp:()=>expForm(),
  editExp:d=>{if(d.id)expForm(d.id)},
  delExp:async d=>{if(!need('accounting.manage'))return;if(await ask('¿Eliminar este gasto?','Eliminar')){S.expenses=S.expenses.filter(e=>e.id!==d.id);closeDlg();save();render();toast('Gasto eliminado')}},
  markPaid:d=>markPaid(d.k,d.id,d.lid),
  copyLibro:()=>{
    const x=acData(acPeriod),q=s=>'"'+String(s==null?'':s).replace(/"/g,'""')+'"';
    const lines=[['Fecha','N° factura','N° control','Cliente','RIF/CI','Base','IVA','IVA retenido','IGTF','Total','Estado'].map(q).join(',')];
    x.invAll.forEach(i=>{const a=i.status==='anulada';lines.push([i.date,i.number,i.control,i.client.name,i.client.idNum,a?0:i.base,a?0:i.iva,a?0:num(i.ivaRet),a?0:i.igtf,a?0:i.total,a?'Anulada':'Emitida'].map(q).join(','))});
    copy(lines.join('\n'),'Libro de ventas copiado');
  },
  previewInv,
  rmLogo:()=>{logoDraft='';const p=$('#logoPrev');if(p)p.innerHTML='<span class="hint">Sin logo (se quitará al guardar)</span>'},
  /* citas */
  newAppt:()=>apptForm(),
  editAppt:d=>{if(d.id)apptForm(d.id)},
  delAppt:async d=>{if(await ask('¿Eliminar esta cita?','Eliminar')){S.appts=S.appts.filter(a=>a.id!==d.id);closeDlg();save();render();toast('Cita eliminada')}},
  apptStart:d=>{if(!need('services.create'))return;const a=S.appts.find(x=>x.id===d.id);if(!a)return;a.status='completada';save();go('servicioForm',{vehicleId:a.vehicleId,desc:a.reason})},
  /* recordatorios */
  newRem:()=>remForm(),
  remDone:d=>{if(!need('reminders.manage'))return;const r=S.reminders.find(x=>x.id===d.id);if(r){r.done=true;save();render();toast('Recordatorio completado')}},
  remDel:d=>{if(!need('reminders.manage'))return;S.reminders=S.reminders.filter(r=>r.id!==d.id);save();render()},
  copyRem:d=>{
    const r=S.reminders.find(x=>x.id===d.id),v=veh(r.vehicleId),c=vOwner(v);
    copy('Hola '+(c?c.first.split(' ')[0]:'')+', te escribimos de '+S.shop.name+'. Te recordamos que tu '+vLabel(v)+' ('+(v?v.plate:'')+') tiene pendiente: '+r.text.replace(/^Próximo: /,'')+'. ¿Quieres agendar una cita?','Aviso copiado');
  },
  /* usuarios */
  newUser:()=>userForm(),
  editUser:d=>userForm(d.id),
  delUser:async d=>{
    if(!need('users.manage'))return;const u=S.users.find(x=>x.id===d.id);if(!u||u.id===meId)return;
    if(await ask('¿Eliminar al usuario '+u.name+'?','Eliminar')){if(CLOUD)cloudDelProfile(u.id);logAct('Eliminó al usuario '+u.name);S.users=S.users.filter(x=>x.id!==u.id);save();render();toast('Usuario eliminado')}
  },
  preset:d=>{const set=PRESETS[d.p]||[];$$('#permBox input[type=checkbox]').forEach(i=>{i.checked=set.includes(i.name.replace('perm_',''))})},
  /* ajustes */
  saveShop:()=>{if(!need('settings.edit'))return;S.shop.name=$('#sn').value.trim()||'Mi taller';S.shop.cur=$('#sc').value.trim()||'$';S.shop.show=$('#sshow').value;S.shop.waAuto=$('#main [name="waAuto"]').checked;{const tp=$('#main [name="waTpl"]').value.trim();S.shop.waTemplate=(tp&&tp!==WA_DEFAULT_TPL.trim())?tp:''}save();render();toast('Ajustes guardados')},
  copyCode:()=>{if(need('users.manage'))copy($('#sync').value,'Código copiado')},
  importCode:()=>{
    if(!need('users.manage'))return;
    try{
      const o=JSON.parse($('#sync').value);
      if(!o||!o.clients||!o.vehicles||!o.services)throw 0;
      const users=S.users,logo=S.inv.logo,inv=S.inv,rates=S.rates;
      S=Object.assign(empty(),o,{users});
      S.inv=Object.assign(defInv(),inv);S.inv.logo=logo;
      if(!S.rates||!S.rates.length)S.rates=rates;
      logAct('Importó datos desde un código');save();render();toast('Datos importados');
    }catch(e){toast('El código no es válido')}
  },
  loadDemo:async()=>{if(need('users.manage')&&await ask('Se reemplazarán clientes, vehículos, servicios, facturas, gastos y catálogo por los de ejemplo. ¿Continuar?','Cargar ejemplo')){const keep=S.inv,dm=demo();Object.assign(S,dm);if(keep.legalName){S.inv=keep;S.inv.nextInv=Math.max(num(keep.nextInv),num(dm.inv.nextInv));S.inv.nextCtrl=Math.max(num(keep.nextCtrl),num(dm.inv.nextCtrl))}logAct('Cargó los datos de ejemplo');save();render();toast('Datos de ejemplo cargados')}},
  clearAll:async()=>{if(need('users.manage')&&await ask('Se borrarán clientes, vehículos, servicios, facturas, gastos, citas y recordatorios. Los usuarios, datos de facturación y tasas se conservan. ¿Continuar?','Borrar')){Object.assign(S,{clients:[],vehicles:[],services:[],appts:[],reminders:[],providers:[],mechanics:[],invoices:[],expenses:[]});logAct('Borró clientes, servicios, facturas y demás datos');save();render();toast('Datos borrados')}}
};

/* ---------- Eventos ---------- */
document.addEventListener('click',e=>{
  if(e.target.closest&&e.target.closest('select,input,textarea'))return;
  const btn=e.target.closest('button[data-act]');
  const t=btn||e.target.closest('[data-act]');
  if(!t||!t.dataset.act)return;
  const f=A[t.dataset.act];
  if(f)f(t.dataset,t);
});
document.addEventListener('input',e=>{
  const t=e.target;
  if(t.closest&&t.closest('#repf')){repUpdate(t)}
  else if(t.id==='q'){query=t.value;const b=$('#svcBody');if(b)b.innerHTML=svcRows()}
  else if(t.id==='cq'){cquery=t.value;const b=$('#cliBody');if(b)b.innerHTML=cliRows()}
  else if(t.id==='pq'){pquery=t.value;const b=$('#provBody');if(b)b.innerHTML=provRows()}
  else if(t.id==='iq'){iquery=t.value;const b=$('#invBody');if(b)b.innerHTML=invRows()}
  else if(t.id==='cs'){const r=$('#cres');if(r)r.innerHTML=resHTML(t.value)}
  else if(t.id==='inspQ'){inspUI.q=t.value;inspFilter()}
  else if(t.id==='catq'){catQ=t.value;const b=$('#catBody');if(b)b.innerHTML=catRows()}
  else if(t.id==='qq'){qQuery=t.value;const b=$('#qBody');if(b)b.innerHTML=quoteRows()}
  else if(t.id==='gq'){gqRender(t.value)}
  else if(t.closest&&t.closest('#pgf')){pgUpdate(t)}
  else if(t.closest&&t.closest('#hsf')){hsUpdate(t)}
  else if(t.closest&&t.closest('#sbf')){sbUpdate(t)}
  else if(t.closest&&t.closest('#pkBody')){pkUpdate()}
  else if(t.classList&&t.classList.contains('ip-note')){const e=sd&&sd.insp&&sd.insp[t.dataset.key];if(e)e.note=t.value}
  else if(t.closest&&t.closest('#sf')){const ln=t.closest('.line');if(ln&&t.classList.contains('lp'))ln.dataset.auto='';if(ln&&t.classList.contains('lhrs'))autoPrice(ln);updTotals()}
});
document.addEventListener('change',e=>{
  const t=e.target;
  if(t.dataset&&t.dataset.ip&&t.closest('#sf')){inspSet(t.dataset.key,t.dataset.ip==='r'?'r':'c',t.checked);inspRefresh()}
  else if(t.id==='inspOnly'){inspUI.only=t.checked;inspFilter()}
  else if(t.id==='logu'){logUser=t.value;render()}

  else if(t.id==='restoreFile'){const f0=t.files&&t.files[0];if(f0)restoreFromFile(f0);t.value=''}
  else if(t.id==='restoreAllFile'){const f0=t.files&&t.files[0];if(f0)restoreAll(f0);t.value=''}
  else if(t.dataset&&t.dataset.act==='subSel'){A.subSel(t.dataset)}
  else if(t.dataset&&t.dataset.act==='subSelAll'){A.subSelAll()}
  else if(t.classList&&t.classList.contains('stq')){setStatus(t.dataset.sid,t.value)}
  else if(t.classList&&t.classList.contains('pkd')&&t.closest('#pkBody')){pkAuto(t.closest('.pkr'))}
  else if(t.id==='expCatSel'){expCat=t.value;render()}
  else if(t.id==='logoFile'){
    const f=t.files&&t.files[0];if(!f)return;
    if(f.size>250*1024){t.value='';return toast('El logo supera 250 KB. Usa una imagen más liviana')}
    const rdr=new FileReader();rdr.onload=()=>{logoDraft=rdr.result;const p=$('#logoPrev');if(p)p.innerHTML='<img src="'+esc(rdr.result)+'" alt="Logo nuevo">'};rdr.readAsDataURL(f);
  }
  else if(t.name==='idType'&&t.closest('#cf')){const x=ID_TYPES.find(i=>i[0]===t.value);const n=$('#cf [name="idNum"]');if(x&&n)n.placeholder=x[1]}
  else if(t.name==='kind'&&t.closest('#cf')){cfKind(true)}
  else if(t.name==='retIva'&&t.closest('#cf')){const b=$('#retPctBox');if(b)b.hidden=!t.checked}
  else if(t.name==='vehicleId'&&t.closest('#sf')){sd.vehicleId=t.value;updKmHint()}
  else if(t.classList&&t.classList.contains('lm')&&t.closest('#sf')){autoPrice(t.closest('.line'))}
  else if(t.name==='mechanicId'&&t.closest('#sf')){$$('#sf .line.lab').forEach(autoPrice)}
  else if((t.name==='ivaApply'||t.name==='igtfApply'||t.name==='retApply')&&t.closest('#mf'))invPrev();
  else if(t.classList&&t.classList.contains('ld')&&t.closest('#sf')){
    const row=t.closest('.line'),name=t.value.trim();
    if(row.classList.contains('lab')){if(labExists(name)){const i=labInfo(name),pr=$('.lp',row),hr=$('.lhrs',row);if(!pr.value)pr.value=i.price;if(hr&&!hr.value&&i.hours)hr.value=i.hours;updTotals()}}
    else if(row.classList.contains('prt')){const p=S.catalog.parts[name];if(p){const pr=$('.lp',row),co=$('.lc',row);if(!pr.value)pr.value=p.price;if(co)co.value=p.cost||'';updTotals()}}
  }
});
document.addEventListener('toggle',e=>{
  const t=e.target;if(!t||!t.matches)return;
  if(t.id==='inspMain')inspUI.open=t.open;
  else if(t.dataset&&t.dataset.sys)inspUI.sys[t.dataset.sys]=t.open;
},true);
document.addEventListener('keydown',e=>{
  if((e.ctrlKey||e.metaKey)&&(e.key==='k'||e.key==='K')&&me()&&isEmail(me().email)&&!me().mustChange){e.preventDefault();openSearch();return}
  if(e.key==='Enter'&&e.target.matches&&e.target.matches('#sf input,#cf input,#invf input,#repf input,#pgf input,#hsf input,#sbf input'))e.preventDefault();
});
document.addEventListener('submit',async e=>{
  const id=e.target.id;
  if(id==='setupForm'){e.preventDefault();await doSetup(e.target)}
  else if(id==='loginForm'){e.preventDefault();await doLogin(e.target)}
  else if(id==='emailForm'){e.preventDefault();doEmail(e.target)}
  else if(id==='recoverForm'){e.preventDefault();await doRecover(e.target)}
  else if(id==='signupForm'){e.preventDefault();await doSignup(e.target)}
  else if(id==='passForm'){e.preventDefault();await doPass(e.target)}
  else if(id==='keyForm'){e.preventDefault();await doKey(e.target)}
  else if(id==='cf'){e.preventDefault();saveClient()}
  else if(id==='sf'){e.preventDefault();await saveService()}
  else if(id==='invf'){e.preventDefault();saveInvSettings()}
  else if(id==='repf'){e.preventDefault()}
  else if(id==='pgf'){e.preventDefault()}
  else if(id==='hsf'){e.preventDefault()}
  else if(id==='sbf'){e.preventDefault()}
});
/* Botón para ver u ocultar la contraseña en todos los campos de contraseña */
const EYE='<svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/></svg>';
const EYE_OFF='<svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M17.94 17.94A10.07 10.07 0 0 1 12 20c-7 0-11-8-11-8a18.45 18.45 0 0 1 5.06-5.94M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.16 3.19m-6.72-1.07a3 3 0 1 1-4.24-4.24"/><line x1="1" y1="1" x2="23" y2="23"/></svg>';
function enhancePw(root){
  (root||document).querySelectorAll('input[type=password]:not([data-pw])').forEach(inp=>{
    inp.dataset.pw='1';
    const had=document.activeElement===inp,w=document.createElement('div');w.className='pwwrap';
    inp.parentNode.insertBefore(w,inp);w.appendChild(inp);
    const b=document.createElement('button');b.type='button';b.className='pweye';b.tabIndex=0;
    b.setAttribute('aria-label','Mostrar contraseña');b.setAttribute('aria-pressed','false');b.title='Mostrar contraseña';b.innerHTML=EYE;
    w.appendChild(b);if(had)inp.focus();
  });
}
try{
  enhancePw(document);
  if(typeof MutationObserver!=='undefined')new MutationObserver(()=>enhancePw(document)).observe(document.body,{childList:true,subtree:true});
  document.addEventListener('click',e=>{
    const b=e.target.closest&&e.target.closest('.pweye');if(!b)return;
    e.preventDefault();const i=b.parentNode.querySelector('input');if(!i)return;
    const show=i.type==='password';i.type=show?'text':'password';
    b.setAttribute('aria-pressed',show?'true':'false');b.setAttribute('aria-label',show?'Ocultar contraseña':'Mostrar contraseña');b.title=show?'Ocultar contraseña':'Mostrar contraseña';b.innerHTML=show?EYE_OFF:EYE;
    i.focus();
  });
}catch(e){}
try{window.addEventListener&&window.addEventListener('storage',e=>{
  if(e.key!==MKEY||!e.newValue)return;
  try{const m=JSON.parse(e.newValue);if(m&&Array.isArray(m.shops)){M=m;ensureMaster(M);curRec=M.shops.find(x=>x.id===curShopId)||null;render()}}catch(x){}
})}catch(e){}
if(CLOUD){
  cloud.loading=true;render();
  cloudBoot().then(()=>{cloud.loading=false;render()}).catch(e=>{cloud.loading=true;cloud.error='No se pudo conectar con Firebase: '+cloudErr(e)+'. Revisa firebase-config.js y las reglas de Firestore.';render()});
}else{bootStore();render()}
})();
